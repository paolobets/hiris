# HIRIS — il cancello delle best practice.
#
# «Seguire le buone pratiche» senza uno strumento che le verifichi non e' una
# regola, e' un auspicio. Valgono solo quelle controllate automaticamente, e
# cio' che non e' controllato non si pretende.
#
# Il rovescio della stessa regola: **una regola esclusa non e' silenzio, e' una
# decisione scritta.** Ogni `ignore` qui sotto porta il suo perche' e il numero
# che l'ha motivata, misurato il 27/08/2026 sul commit 28b0874.
#
# Questo file NON e' un file di packaging: HIRIS e' un add-on, non un pacchetto.
# Contiene `[tool.ruff]` e nient'altro.
#
# Spec: docs/design/2026-08-27-il-linter-e-le-best-practice.md

[tool.ruff]
# Il piu' basso che il CI dichiara di supportare: e' quello che il codice deve
# saper girare, non quello su cui gira in casa (l'add-on e' su 3.13).
target-version = "py311"

# Il codice e' GIA' scritto a ~90 colonne: p95=80, p99=91. 100 e' il numero
# tondo appena sopra la realta' misurata. Il default di ruff (88) costerebbe
# 1298 riformattazioni e sarebbe uno stile importato invece che il proprio.
# E' anche la soglia che `ruff format` erediterA', quando entrera' (dopo la
# rinomina in inglese, mai insieme).
line-length = 100

[tool.ruff.lint]
# Base: il set di default della versione appuntata in hiris/requirements.txt.
# Il pin `<0.17.0` esiste per questo: un linter che cambia da solo il proprio
# default trasforma un CI verde in rosso senza che nessuno abbia toccato una riga.
# `A` (flake8-builtins) e `W291` entrano il 01/09, e non per gusto: la famiglia
# di `A` ha prodotto un GUASTO VIVO in produzione. `richiesta -> request` dentro
# `_security_headers(request, handler)` ha scritto `request = request.query.get("v")`
# -- riassegna il parametro, e due righe dopo `request.path` su una stringa: 500 su
# ogni asset. Quel caso preciso non lo vede `A` (`request` non e' un builtin) ma e'
# la stessa forma, e `A` chiude la meta' che si puo' chiudere meccanicamente.
# Misurato prima di accenderla: **12 violazioni**, tutte precedenti a questo giro.
# `W291`: sei, tutte in un file solo.
#
# **`E301`-`E306` (righe bianche) restano SPENTE, e la ragione non e' il
# numero.** Sono 72 violazioni, tutte auto-correggibili -- il costo non e'
# quello. `ruff` le implementa solo in `preview`, e `preview = true` e' un
# interruttore GLOBALE: accenderebbe insieme il comportamento sperimentale di
# ogni altra regola gia' selezionata, cioe' esattamente la cosa che il pin
# `<0.17.0` poche righe piu' su esiste per impedire -- un linter che cambia da
# solo il proprio giudizio. Si pagherebbe un interruttore globale per una
# classe cosmetica: no. Misurato il 01/09 (39 E302, 12 E306, 10 E305, 9 E303,
# 2 E301). L'unico sito che questo giro aveva sporcato e' stato messo a posto a
# mano (`scripts/rinomina.py`, due righe bianche fra due «def» di modulo).
extend-select = ["E501", "A", "W291"]  # E501: le righe lunghe non sono nel default

ignore = [
    # BLE001 (blind-except) — 103 casi, 99 in produzione.
    # In questo prodotto `except Exception` e' spesso una DIFESA DELIBERATA, e
    # la maggioranza dei blocchi ha gia' il perche' scritto nel commento
    # accanto («una difesa che solleva non e' una difesa»). Spegnerla ha pero'
    # un COSTO DI COPERTURA vero, non nullo: BLE001 vede ogni `except
    # Exception`/`except BaseException`, qualunque sia la sua forma. S110
    # (try-except-pass), che resta accesa, vede SOLO la forma sintattica
    # `try: ... except ...: pass`. Non vede `with contextlib.suppress(...)`,
    # e non vede un `except Exception:` che assorbe l'errore e continua con un
    # valore neutro invece di rilanciare — due forme che questa stessa fetta
    # ha usato (i sette S110 convertiti in `suppress(...)`, es.
    # hiris/app/backends/openai_compat_runner.py:73). Oggi quelle difese mute
    # non sono sorvegliate da nessuna regola accesa. La accettiamo lo stesso
    # perche' l'alternativa — tenere BLE001 accesa — costerebbe 99 `# noqa` in
    # produzione su un pattern che qui e' la norma, non l'eccezione: rumore
    # che nasconderebbe i pochi casi genuinamente muti invece di segnalarli.
    # E' una scelta di rumore-vs-copertura, non un'equivalenza: non sostenerla
    # come tale.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# A001/A002 — 11 casi, TUTTI in `memory/`, tutti `type` e `id` come parametri o
# locali, e tutti precedenti al giro che ha acceso la regola (li ha scritti la
# conversione di `memory/`, lotti 5-6). Non si toccano ADESSO per una ragione
# misurata e non per pigrizia: rinominare un parametro dentro un ambito CHIUSO
# vuol dire riaprire le sue sponde, ed e' esattamente la manovra che l'01/09 ha
# prodotto il guasto di `_security_headers` — a valle di un rilascio in
# preparazione e' il momento peggiore per farla. La regola resta ACCESA su tutto
# il resto, che e' il punto: da oggi un builtin ombreggiato NUOVO va rosso. Il
# tredicesimo caso, `server.py::round`, e' stato rinominato invece che ignorato,
# perche' quello lo aveva scritto il giro in corso.
"hiris/app/memory/*.py" = ["A001", "A002"]
# F811 — 56 casi, 55 FALSI POSITIVI: sono i parametri-fixture di pytest che
#        ombreggiano il nome della fixture. L'unico caso vero (un test scritto
#        due volte) e' stato sanato PRIMA di scrivere questa riga.
# S102  — 21 `exec`: usati per caricare moduli nelle finte. E' l'UNICA regola
#        di flake8-bandit che il set di default di ruff 0.16.4 accende ed e'
#        rilevante nei test (verificato con
#        `ruff check --isolated --show-settings`: di bandit sono accese solo
#        S102, S110, S112).
#
# Di conseguenza le righe che spegnevano anche S101/S105/S106/S108 nei test e
# S101 in scripts/** e .smoke-test/** sono state tolte: quelle regole erano
# GIA' spente di loro (non fanno parte del default), quindi spegnerle qui non
# aveva nessun effetto — erano rumore che raccontava una decisione mai presa.
# Per lo stesso motivo la vecchia nota «S107 NON e' spenta: nella misura non
# e' servito spegnerla» era fuorviante: S107 e' spenta di suo, non per merito
# di questo file.
#
# Il vero costo e' un altro: di flake8-bandit, questo cancello sorveglia SOLO
# S102/S110/S112. Tutto il resto — segreti scritti nel codice (S105/S106/
# S107), SQL concatenato (S608), hash deboli (S324), `verify=False`, TLS non
# verificato, `shell=True`/subprocess non sicuro (S603/S607), `yaml.load` non
# sicuro (S506), bind su tutte le interfacce (S104), apertura URL sospetta
# (S310) — NON e' sorvegliato. Misurato il 27/08/2026: accendere tutto `S`
# (`extend-select = [..., "S"]`) su `hiris scripts tests conftest.py
# .smoke-test` produce 26 rilievi: S608 10, S324 3, S603 3, S105 2, S107 2,
# S310 2, S101 1, S104 1, S506 1, S607 1. Di questi, S506 e' un FALSO
# POSITIVO gia' verificato: hiris/app/home_space/yaml_loader.py:56 chiama
# `yaml.load` con `_HALoader`, che eredita da `yaml.SafeLoader` — ruff non
# risale la gerarchia delle classi e non lo vede. Il codice lo spiega gia' in
# un commento e un test lo dimostra. Gli altri 25 restano da valutare uno per
# uno: non sono ne' accesi ne' esclusi, sono semplicemente non ancora guardati.
"tests/**" = ["F811", "S102"]
