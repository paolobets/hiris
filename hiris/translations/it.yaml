configuration:
  # REGOLA DI QUESTO FILE: una descrizione risponde a UNA domanda — «cosa
  # succede se lo tocco?». Non cosa e', non perche' esiste, non come ci siamo
  # arrivati, non i casi limite. Tetto: ~160 caratteri, due righe sullo schermo
  # di un telefono.
  #
  # Il «perche'» sta nei commenti di `config.yaml`, dove lo legge chi mantiene,
  # non nel modulo, dove lo subisce chi configura. Il percorso completo
  # dell'abbonamento sta in `docs/prova-la-2.0.md`.
  #
  # I NOMI portano il raggruppamento dove non c'e' una sezione vera: il
  # Supervisor rende a schermo solo i dizionari annidati (`ponte:`,
  # `local_model:`, `memory:`), e per tutto il resto restano i prefissi
  # «Provider · » e «Avanzate · ». Dentro una sezione il prefisso NON si ripete:
  # lo porta gia' l'intestazione.
  #
  # Parita' it/en pinnata da `tests/test_traduzioni_coprono_le_opzioni.py`, che
  # pinna anche «non si misurano» in `claude_code_oauth_token`.

  # ── 1. Provider AI ────────────────────────────────────────────────────────
  provider_claude:
    name: "Provider · Claude API (a consumo)"
    description: "Accende Claude, pagato a consumo. Serve anche la chiave qui sotto. Dal primo provider che accendi valgono solo quelli accesi: riaccendi gli altri che usavi."
  claude_api_key:
    name: "Provider · Claude API — chiave"
    description: "Paga le risposte di Claude; la prendi su console.anthropic.com. PRIVACY: messaggi e contesto della casa passano da Anthropic (USA)."
  provider_subscription:
    name: "Provider · Piano Claude Max (a forfait)"
    description: "Ragiona sul tuo piano Claude Max invece che a consumo. Col token qui sotto accende da se' il ponte: la chat ci passa, con la casa e i ricordi."
  claude_code_oauth_token:
    name: "Provider · Piano Claude Max — token"
    description: "Apre il piano; lo generi con `claude setup-token`. ATTENZIONE: qui i consumi non si misurano, e valgono le condizioni del piano Claude Max."
  provider_openrouter:
    name: "Provider · OpenRouter"
    description: "Accende OpenRouter: una chiave sola per 200+ modelli. Serve anche la chiave qui sotto."
  openrouter_api_key:
    name: "Provider · OpenRouter — chiave"
    description: "La chiave di openrouter.ai; ci sono anche modelli ':free'. PRIVACY: i messaggi passano da OpenRouter (USA) e dal fornitore del modello."
  hide_free_models:
    name: "OpenRouter — nascondi i modelli gratuiti (:free)"
    description: "Toglie i modelli ':free' dagli elenchi, cosi' non li scegli per sbaglio: hanno quota giornaliera bassa e rate-limit frequenti."
  provider_openai:
    name: "Provider · OpenAI"
    description: "Accende i modelli OpenAI (GPT-4o, o1...). Serve anche la chiave qui sotto."
  openai_api_key:
    name: "Provider · OpenAI — chiave"
    description: "Paga le risposte OpenAI. PRIVACY: i messaggi passano dai server OpenAI (USA)."
  provider_ollama:
    name: "Provider · Ollama (sul tuo hardware)"
    description: "Accende un modello che gira in casa tua: niente cloud, niente costo a risposta. Servono anche indirizzo e modello qui sotto."
  local_model:
    name: "Ollama — dove sta e quale modello"
    description: "Dove trovare Ollama e quale modello usare. Lasciati vuoti, l'interruttore qui sopra non ha effetto."
    url:
      name: "Ollama — indirizzo"
      description: "Indirizzo della tua istanza, es. http://192.168.1.10:11434. Se all'avvio HIRIS non la raggiunge, lo scrive nel registro."
    model:
      name: "Ollama — nome del modello"
      description: "Il modello da usare, es. llama3. Dev'essere gia' scaricato li': se manca, all'avvio HIRIS lo segnala nel registro."
    request_timeout:
      name: "Ollama — quanto aspettare una risposta (secondi)"
      description: "Passato questo tempo la chiamata viene abbandonata e la chat mostra un errore. Alzalo su hardware lento. 10–1800, predefinito 120."

  # ── 2. Scelta fra i provider accesi ───────────────────────────────────────
  llm_strategy:
    name: "Ordine di ripiego fra i provider accesi"
    description: "In che ordine prova i provider accesi quando il modello e' «auto»: 'balanced' parte da Claude, 'cost_first' dal locale. La pagina Modelli vince."

  # ── 3. Ponte: la chat sul piano Claude Max ────────────────────────────────
  # Annidate sotto `ponte:` nella 2.4.0: e' l'unico raggruppamento che il
  # Supervisor rende a schermo. Con l'intestazione della sezione a portarlo, il
  # prefisso «Ponte · » esce dai nomi dei figli -- ripeterlo dentro un blocco
  # che gia' si chiama «Ponte» era esattamente la ridondanza che questo lavoro
  # toglie. I nomi restano comunque autosufficienti se letti da soli.
  #
  # UN INTERRUTTORE SOLO (13 agosto 2026). Erano due, «(1 di 2)» e «(2 di 2)»:
  # quei marcatori erano la cura per una malattia -- due leve che dovevano
  # essere accese insieme -- e se ne vanno con lei. Adesso il nome dice cosa
  # l'interruttore FA, che e' quello che un nome deve dire.
  ponte:
    name: "Ponte — la chat sul piano Claude Max"
    description: "Serve solo se usi il piano Claude Max. Se il piano e' acceso col suo token, il ponte si accende da se' e qui non devi toccare niente."
    attivo:
      name: "Accendi il ponte"
      description: "Manda la chat al runner del piano invece che al provider a consumo. Li' la chat sa e fa quanto nell'altra modalita'."
    bridge_deadline_min:
      name: "Quanto aspettare una risposta (minuti)"
      description: "Passato questo tempo il messaggio scade: errore in chat, nessun ripiego sul provider a consumo. 1–120, predefinito 5."
    chat_daily_cap:
      name: "Quanti messaggi al giorno"
      description: "Oltre questi messaggi al giorno sul ponte, la chat da' errore e non invia. Attenzione: 0 li blocca tutti, non vuol dire «illimitato». 0–1000."

  # ── 4. Aspetto e conservazione ────────────────────────────────────────────
  theme:
    name: "Aspetto — chiaro o scuro"
    description: "Il tema con cui si apre HIRIS; 'auto' segue il sistema. Se poi usi l'interruttore chiaro/scuro dentro HIRIS, su quel browser vince quello."
  history_retention_days:
    name: "Per quanti giorni tenere le conversazioni"
    description: "Ogni notte cancella i messaggi vecchi. Lo stesso numero limita anche quanto HIRIS rilegge della conversazione: abbassarlo gli fa dimenticare prima. 0 = mai."

  # ── 5. Embedding (oggi inattivi) ──────────────────────────────────────────
  memory:
    name: "Embedding — oggi non hanno effetto"
    description: "Provider e modello per la ricerca per somiglianza. Oggi non fanno niente: nessuna parte di HIRIS calcola embedding."
    embedding_provider:
      name: "Embedding — provider (inattivo)"
      description: "Quale servizio li calcolerebbe: openai, ollama, model2vec. Oggi il valore viene solo letto e mostrato nella pagina Modelli."
    embedding_model:
      name: "Embedding — modello (inattivo)"
      description: "Quale modello userebbe: text-embedding-3-small, nomic-embed-text, minishlab/potion-base-8M. Oggi non viene mai invocato."

  # ── 6. Avanzate: registro, sicurezza, diagnostica ─────────────────────────
  log_level:
    name: "Avanzate · dettaglio del registro"
    description: "Quanto scrive HIRIS nel registro. Per segnalare un guasto: metti 'debug', riproduci il problema, allega quello che vedi."
  internal_token:
    name: "Avanzate · token delle API interne"
    description: "LASCIALO VUOTO: HIRIS ne genera uno al primo avvio e lo riusa sempre. Scrivine uno solo se un altro componente deve chiamare la sua API."
  supervisor_ingress_cidr:
    name: "Avanzate · reti riconosciute come ingress"
    description: "Chi arriva da queste reti entra senza token, tutti gli altri no. Allargarlo apre la API di HIRIS. Predefinito: la rete del Supervisor."
  debug_expose_port:
    name: "Avanzate · promemoria porta 8099 (solo diagnostica)"
    description: "DA SOLO NON APRE NIENTE: scrive un promemoria nel registro. Ad aprire la porta e' la sezione Rete qui sotto — e allora la LAN vede /api/*."
