configuration:
  claude_api_key:
    name: "Chiave API Claude"
    description: "Chiave API per Anthropic Claude. Obbligatoria se vuoi usare Claude come provider AI. Ottienila su console.anthropic.com. PRIVACY: i messaggi e i contesti inviati passano dai server Anthropic (USA) — vedi anthropic.com/privacy."
  openai_api_key:
    name: "Chiave API OpenAI"
    description: "Chiave API per i modelli OpenAI (GPT-4o, o1, ecc.). Necessaria solo se OpenAI fa parte della tua strategia/politiche di routing. PRIVACY: i messaggi passano dai server OpenAI (USA) — vedi openai.com/policies."
  openrouter_api_key:
    name: "Chiave API OpenRouter"
    description: "Chiave API per OpenRouter — un proxy unificato che da' accesso a 200+ modelli (Claude, GPT, Llama, Gemini, Mistral, Qwen, DeepSeek, ecc.) con un'unica chiave. Ottienila su openrouter.ai. Sono disponibili modelli gratuiti (suffisso ':free' es. 'meta-llama/llama-3.3-70b-instruct:free'). Per usarli, imposta nel campo modello di un agente il formato 'openrouter:provider/nome-modello'. PRIVACY: i messaggi passano da OpenRouter (USA) e poi dal provider del modello scelto — vedi openrouter.ai/privacy."
  # Fix della review totale della fetta "il ponte riceve il nucleo" (parita' A,
  # I-2/I-3), decisione del proprietario: "dirlo nella UI e procedere".
  # Il difetto: `server.py` calcola `_chat_via_subscription_cfg` come
  # `env_bool("CHAT_VIA_SUBSCRIPTION") OR _sub_first_class`, quindi attivare
  # QUESTO toggle col token OAuth presente accende il ponte E la
  # chat-via-abbonamento anche con l'opzione `chat_via_subscription` spenta.
  # La descrizione che spiega cosa viaggia sul ponte stava solo su
  # `chat_via_subscription`, cioe' sull'opzione che chi attiva il provider non
  # tocca mai: la conseguenza si spiegava dove non veniva letta. Nessun cambio
  # di comportamento -- solo il testo: l'utente sceglie sapendo.
  # (Il rinvio e' al NOME `_chat_via_subscription_cfg`, non a un numero di
  # riga: i numeri invecchiano al primo commit che sposta il blocco.)
  provider_subscription:
    name: "Attiva provider: Abbonamento (Claude Max)"
    description: "Attiva l'abbonamento Claude (Claude Max, tramite il runner in-addon) come provider AI. Richiede il token OAuth (claude_code_oauth_token). ATTENZIONE — cosa comporta: attivarlo con il token OAuth presente INSTRADA LA CHAT SUL PONTE dell'abbonamento, cioè accende «Chat via abbonamento — attiva» anche se quell'opzione resta spenta. Su quel percorso, insieme al tuo messaggio, viaggiano la conoscenza della casa (il nucleo: aree, entità, cosa è notevole adesso, cosa la casa fa da sola) e i ricordi di ciò che le persone hanno detto, sessioni precedenti comprese — sotto le condizioni d'uso e di conservazione dell'abbonamento Claude Max, che sono diverse da quelle dell'API a consumo usata dall'altro percorso. Vedi «Chat via abbonamento — attiva» più sotto per che cosa la chat riceve su quel percorso. Un provider è usato solo se attivo qui E con la sua credenziale. NOTA: se lasci tutti i toggle provider_* disattivi su un install esistente, HIRIS continua a derivare i provider attivi dalle credenziali già presenti (retro-compatibile); appena attivi UN toggle qualsiasi, sono attivi solo i toggle che accendi, quindi riattiva ogni provider che vuoi mantenere."
  provider_claude:
    name: "Attiva provider: API Claude"
    description: "Attiva l'API Claude come provider AI (richiede claude_api_key). Un provider è usato solo se attivo qui E con la sua credenziale. Vedi la nota su provider_subscription sull'attivazione dei toggle su un install esistente."
  provider_openai:
    name: "Attiva provider: API OpenAI"
    description: "Attiva l'API OpenAI come provider AI (richiede openai_api_key). Un provider è usato solo se attivo qui E con la sua credenziale. Vedi la nota su provider_subscription sull'attivazione dei toggle su un install esistente."
  provider_openrouter:
    name: "Attiva provider: OpenRouter"
    description: "Attiva OpenRouter come provider AI (richiede openrouter_api_key). Un provider è usato solo se attivo qui E con la sua credenziale. Vedi la nota su provider_subscription sull'attivazione dei toggle su un install esistente."
  provider_ollama:
    name: "Attiva provider: Ollama (locale)"
    description: "Attiva il modello Ollama locale come provider AI (richiede local_model url + model). Un provider è usato solo se attivo qui E con la sua credenziale. Vedi la nota su provider_subscription sull'attivazione dei toggle su un install esistente."
  hide_free_models:
    name: "Nascondi modelli :free di OpenRouter"
    description: "Se attivo, i modelli ':free' di OpenRouter non compaiono nel menu modelli della pagina Modelli (#/models) né in quello delle impostazioni della chat. Utile se hai acquistato credito OpenRouter e preferisci evitare la quota giornaliera bassa e i frequenti rate-limit upstream del tier gratuito."
  llm_strategy:
    name: "Strategia LLM"
    description: "Come HIRIS seleziona i modelli quando ne sono disponibili più di uno. 'balanced' (default) parte da Claude, poi preferisce OpenRouter rispetto allo slot OpenAI dedicato, prima di ricadere su Ollama locale. 'cost_first' preferisce modelli più economici/locali per primi. 'quality_first' parte sempre da Claude, poi OpenAI, poi OpenRouter, poi Ollama."
  chat_policy:
    name: "Politica backend — chat"
    description: "Ordine backend per la chat interattiva, es. claude,ollama — vuoto = usa la strategia."
  local_model:
    name: "Modello Locale (Ollama)"
    description: "Impostazioni per un modello Ollama ospitato localmente. Lascia vuoto se non usi Ollama."
    url:
      name: "URL Ollama"
      description: "URL base della tua istanza Ollama. Esempio: http://192.168.1.10:11434"
    model:
      name: "Nome Modello Ollama"
      description: "Nome del modello Ollama da usare. Esempio: llama3, mistral, phi3."
    request_timeout:
      name: "Timeout richiesta Ollama (secondi)"
      description: "Tempo massimo di attesa per una singola chiamata Ollama. Default 120s. Aumenta se hai hardware lento con modelli grandi (Pi 5 con gemma2:9b può richiedere 240–300s). Range: 10–1800."
  memory:
    name: "Memoria & RAG"
    description: "Impostazioni per la memoria a lungo termine di HIRIS e la ricerca semantica (RAG). Lascia vuoti i campi embedding per disabilitare il RAG."
    embedding_provider:
      name: "Provider Embedding"
      description: "Provider per gli embedding della memoria semantica. Opzioni: 'openai' (richiede chiave API), 'ollama' (richiede server locale), 'model2vec' (completamente locale, nessun server, compatibile con tutti i sistemi). Lascia vuoto per disabilitare il RAG."
    embedding_model:
      name: "Modello Embedding"
      description: "Modello per generare gli embedding. openai: text-embedding-3-small. ollama: nomic-embed-text. model2vec: minishlab/potion-base-8M o potion-base-32M (lascia vuoto per il default)."
    rag_k:
      name: "Risultati RAG (k)"
      description: "Numero di memorie rilevanti restituite durante la ricerca semantica. Valori più alti danno più contesto ma aumentano l'uso di token."
  # fetta E4, riparazione del ponte: la descrizione diceva «Lascia vuoto per
  # generarlo automaticamente» ma nessuno generava niente -- con il campo vuoto
  # (il default di config.yaml) ogni chiamata non-ingress prendeva 401 e il
  # ponte della chat girava a vuoto per sempre. Ora la generazione esiste
  # davvero (app/token_interno.py) e la descrizione racconta cio' che il codice
  # fa: genera, conserva in /data, rilegge al riavvio.
  internal_token:
    name: "Token Interno"
    description: "Token segreto che protegge le chiamate API interne di HIRIS, fra cui quelle del ponte della chat via abbonamento. Lascialo vuoto e HIRIS ne genera uno al primo avvio e lo conserva nei dati dell'add-on: resta lo stesso a ogni riavvio e non devi farci niente. Valorizzalo a mano solo se un altro componente (per esempio il gateway MCP) deve chiamare la API di HIRIS con un token che decidi tu: in quel caso vince il tuo, e HIRIS non genera ne' scrive nulla."
  supervisor_ingress_cidr:
    name: "CIDR ingress Supervisor fidata"
    description: "Range IP sorgente trattati come vero ingress del Supervisor HA per il bypass X-Ingress-Path (CR-1). Tutto il resto richiede il token interno. Default 172.30.32.0/23; restringi (es. 172.30.32.2/32) se esponi la API a un tunnel."
  log_level:
    name: "Livello Log"
    description: "Verbosità dei log dell'add-on. Usa 'debug' per la diagnostica, 'info' per il funzionamento normale, 'warning' o 'error' per output minimale."
  theme:
    name: "Tema"
    description: "Tema colori per l'interfaccia web di HIRIS. 'auto' segue le preferenze del sistema."
  history_retention_days:
    name: "Conservazione Cronologia (giorni)"
    description: "Quanti giorni conservare la cronologia delle conversazioni prima della cancellazione automatica. Predefinito: 90 giorni."
  # fetta E4, giro di chiusura (voce 2): la descrizione diceva «Spento = la chat
  # via abbonamento non si attiva». Falso: `_sub_first_class` (server.py:907,
  # cioe' provider_subscription attivo CON token OAuth) e' OR-ato dentro
  # `_bridge_enabled` (server.py:1332-1335), quindi con questa opzione a false
  # il ponte si accende lo stesso. E' la stessa implicazione gia' dichiarata,
  # tre righe piu' sotto, nella descrizione di chat_via_subscription e nel
  # README (:225): non poteva restare smentita nello stesso pannello.
  bridge_enabled:
    name: "Ponte abbonamento — attiva"
    description: "Instrada la chat via abbonamento (se attiva sotto) a un runner esterno su abbonamento invece che al provider locale/a consumo. NOTA: se attivi il provider «Abbonamento (Claude Max)» e il token OAuth è presente, il ponte si accende comunque, anche lasciando questa opzione spenta."
  bridge_deadline_min:
    name: "Ponte abbonamento — scadenza (minuti)"
    description: "Minuti entro cui un messaggio di chat instradato al runner esterno deve ricevere risposta prima di scadere (l'utente vede un errore, nessun ripiego automatico). Predefinito: 5."
  # fetta E4, fix della review totale (I2): la descrizione diceva «indipendente
  # dal cap della Sentinella». La Sentinella e' uscita con la fetta E3 Task 7 e
  # con lei SENTINEL_DAILY_CAP: il confronto era con un soggetto morto. Il
  # comportamento vero e' quello di handlers_chat.py:220-226 (429 e messaggio
  # non inviato) piu' l'assenza di ripiego dichiarata da bridge_deadline_min.
  chat_daily_cap:
    name: "Chat via abbonamento — cap messaggi/giorno"
    description: "Numero massimo di messaggi di chat che HIRIS instrada in un giorno al runner esterno su abbonamento. Superato il limite la chat risponde con un errore e il messaggio non parte: non c'è ripiego automatico sul provider locale/a consumo. Conta solo i messaggi instradati sull'abbonamento. Predefinito: 50."
  # fetta E4, fix della review totale (I2): la descrizione diceva «non solo la
  # scansione olistica». La scansione olistica e' uscita fra la fetta E3 Task 4
  # (il produttore dei job) e la E4 Task 8 (il ramo che li ragionava): l'unico
  # job che il ponte puo' ricevere oggi e' kind="chat", quindi il «non solo»
  # confrontava con il nulla.
  #
  # fetta "il ponte riceve il nucleo" (parita' A, Task 6): la parita' arrivo'
  # a META' e questo testo fu riscritto per dirlo -- su questo percorso la chat
  # riceve la conoscenza della casa (il nucleo, la stessa stringa del percorso
  # sincrono, `handlers_chat.componi_contesto_chat`) ma non gli strumenti.
  #
  # fetta "il ponte riceve gli strumenti" (parita' B): l'altra meta' e'
  # arrivata, e questo testo e' rimasto indietro di una fetta -- fino a oggi
  # diceva "ma NON i suoi strumenti", cioe' NEGAVA una capacita' che il codice
  # ha. E' lo stesso difetto che questo ramo passa il tempo a chiudere, girato
  # al contrario: di solito il testo promette cio' che il codice non fa, qui
  # negava cio' che il codice fa -- e chi lo leggeva non avrebbe mai provato a
  # chiedere alla chat in abbonamento di cercare qualcosa.
  #
  # Il testo di adesso e' vero in TUTTI E DUE gli stati, perche' gli stati sono
  # due e li decide una sonda, non una configurazione: `agent/runner.py::
  # sonda_strumenti` interroga `POST /api/mcp` prima di partire, e da
  # quell'unico booleano discendono insieme il prompt (`_GUIDA_CON_STRUMENTI`
  # oppure `_GUIDA_SENZA_STRUMENTI`) e gli argomenti della CLI. Quando la sonda
  # riesce il modello ha i quattro strumenti col prefisso `mcp__hiris__`;
  # quando non riesce la risposta e' preceduta da `AVVISO_STRUMENTI_ASSENTI`,
  # che e' la riga che l'utente legge. Promettere gli strumenti senza dire del
  # secondo stato sarebbe il difetto di prima con il segno di nuovo invertito.
  #
  # L'implicazione dichiarata in coda e' quella del punto in cui `server.py`
  # cabla la coda di ragionamento leggendo `_bridge_enabled`, OR-ato con
  # `_sub_first_class` (calcolata subito dopo `derive_active_providers`):
  # provider_subscription attivo CON token OAuth accende sia il ponte sia
  # questa modalita', anche con l'opzione a false. (I rinvii sono ai NOMI e
  # non ai numeri di riga: un numero invecchia al primo commit che sposta
  # quel blocco, ed e' successo cinque volte in questa sola fetta.)
  chat_via_subscription:
    name: "Chat via abbonamento — attiva"
    description: "Instrada le risposte della chat al runner esterno su abbonamento invece che al provider locale/a consumo, con il cap giornaliero e la scadenza qui sopra. Su questo percorso la chat riceve la conoscenza della casa — il nucleo, ricordi e sessioni precedenti compresi, le stesse cose che sa nell'altra modalità — e, quando il runner riesce a ricollegarsi a HIRIS, anche i suoi quattro strumenti: può cercare fra le entità e guardare lo stato ADESSO, non solo la fotografia scattata quando il messaggio è partito, e può ricordare e richiamare. Se quel collegamento non riesce risponde lo stesso, con ciò che sa dal nucleo e dalla conversazione, e te lo dice in cima alla risposta invece di far finta di aver guardato. In nessuno dei due casi agisce sulla casa: non accende, non spegne, non tocca automazioni. Sotto la risposta trovi le targhette degli strumenti che ha usato davvero. Ha effetto solo se «Ponte abbonamento — attiva» qui sopra è anch'esso attivo. NOTA: se attivi il provider «Abbonamento (Claude Max)» ed è presente il token OAuth, questa modalità si accende lo stesso, anche lasciando questa opzione spenta. Predefinito: spento."
  # fetta «fix pre-UAT»: `claude_code_oauth_token` era in config.yaml fra le
  # `options` E nello `schema`, ma non aveva voce qui ne' in en.yaml -- nel
  # Supervisor si presentava senza etichetta e senza descrizione, ed e' il
  # campo che accende il percorso dell'UAT (abbonamento, nessuna chiave API).
  # Il Task 11 aveva verificato la parita' it/en, che era vera: mancava in
  # ENTRAMBE. La copertura si controlla contro config.yaml, non fra le due
  # lingue.
  claude_code_oauth_token:
    name: "Token OAuth Claude Code (abbonamento)"
    description: "Token OAuth dell'abbonamento Claude (Claude Max) con cui HIRIS ragiona senza consumare credito dell'API a consumo. È il campo che accende il percorso abbonamento: valorizzalo E attiva «Attiva provider: Abbonamento (Claude Max)» qui sopra — con entrambi presenti, la chat viene instradata sull'abbonamento anche lasciando spente «Ponte abbonamento — attiva» e «Chat via abbonamento — attiva». Lo ottieni sulla macchina dove hai già Claude Code installato e autenticato, con il comando `claude setup-token`, e incolli qui la stringa che stampa. ATTENZIONE: su questo percorso i consumi NON si misurano — l'abbonamento non espone né i token né il costo della singola risposta, e la pagina Consumi lo dichiara invece di mostrare zeri — e valgono le condizioni d'uso e di conservazione dell'abbonamento Claude Max, diverse da quelle dell'API a consumo. Lascialo vuoto se usi solo chiavi API."
  mayan:
    name: "Mayan EDMS (documenti)"
    description: "Impostazioni per ingerire documenti da Mayan EDMS nel second brain. Lascia url/token vuoti per disabilitare. tag_id deve essere > 0 per attivare il polling."
    url:
      name: "URL Mayan"
      description: "URL base dell'API Mayan EDMS v4. Esempio: http://192.168.1.31:8090/api/v4"
    token:
      name: "Token API Mayan"
      description: "Token API per l'autenticazione Mayan. Generalo in Mayan → Account → API Tokens."
    tag_id:
      name: "ID Tag"
      description: "ID del tag Mayan da ingerire (es. il tag 'HIRIS'). Imposta 0 per disabilitare."
    sensitivity:
      name: "Sensibilità Documenti"
      description: "Livello di privacy per i documenti ingeriti. 'sensitive' (default, consigliato per estratti conto, fatture) nasconde il contenuto all'AI cloud. 'normal' permette il recall RAG completo."
    poll_minutes:
      name: "Intervallo Polling (minuti)"
      description: "Con quale frequenza HIRIS interroga Mayan per nuovi documenti. Default 60. Range: 5–1440."
  debug_expose_port:
    name: "🛠 Debug — warning esposizione porta (DEV ONLY, da solo NON apre la porta)"
    description: >-
      ⚠️ Questo interruttore DA SOLO NON apre la porta 8099 — logga solo un
      warning ad ogni avvio addon come promemoria. Per esporre realmente la
      porta sulla LAN devi ANCHE andare in Impostazioni → Componenti
      aggiuntivi → HIRIS → Configurazione → Rete (sotto questa sezione,
      richiede la Modalità avanzata di HA) e impostare '8099/tcp' = 8099,
      poi Save + Restart. ATTIVA SOLO PER DEV/DIAGNOSTICA. Disattiva questo
      interruttore e svuota il port mapping in Rete quando finito. Senza
      HTTPS chiunque sulla LAN può chiamare /api/* (solo internal_token come
      barriera). NON lasciare attivo in produzione.
