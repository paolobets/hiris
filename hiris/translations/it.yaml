configuration:
  # L'ordine di questo file segue `config.yaml`, cioe' l'ordine in cui i campi
  # compaiono nel Supervisor. Il Supervisor non rende sezioni ne' separatori:
  # il raggruppamento e' fatto dal PREFISSO dell'etichetta ("Provider · ",
  # "Ponte · ", "Avanzate · ") e dalla vicinanza. Una parola sola, un
  # significato solo: "Piano Claude Max" e' il modo di pagare, "Ponte" e' il
  # meccanismo che ci porta la chat. Prima la parola «abbonamento» compariva
  # in tre etichette diverse con tre significati diversi.
  #
  # Le descrizioni dicono COSA SUCCEDE se tocchi il campo, non cosa e': nel
  # Supervisor sono l'unico aiuto che l'utente ha.

  # ── 1. Provider AI ────────────────────────────────────────────────────────
  provider_claude:
    name: "Provider · Claude API (a consumo)"
    description: "Accende Claude come provider, pagato a consumo sulla chiave qui sotto. Servono tutte e due le cose: questo interruttore E la chiave. Finche' non accendi nessun provider, HIRIS resta com'era e li ricava dalle credenziali che trova; dal primo che accendi valgono solo quelli accesi, quindi riaccendi anche gli altri che usavi."
  claude_api_key:
    name: "Provider · Claude API — chiave"
    description: "La chiave che paga le risposte di Claude; la ottieni su console.anthropic.com. Senza, l'interruttore qui sopra resta senza effetto. PRIVACY: i messaggi e il contesto della casa passano dai server Anthropic (USA) — anthropic.com/privacy."
  provider_subscription:
    name: "Provider · Piano Claude Max (a forfait)"
    description: "Fa ragionare HIRIS con il tuo piano Claude Max invece che con l'API a consumo: le risposte non intaccano il credito. Serve anche il token qui sotto. ATTENZIONE, e' la conseguenza da sapere prima di accenderlo: con il token presente questo interruttore instrada la chat sul ponte DA SOLO — i due interruttori «Ponte · ...» piu' in basso si accendono comunque, anche lasciandoli spenti. Su quel percorso, insieme al tuo messaggio, viaggiano la conoscenza della casa e i ricordi di cio' che le persone hanno detto, sessioni precedenti comprese, sotto le condizioni d'uso e di conservazione del piano Claude Max, che sono diverse da quelle dell'API a consumo. Finche' non accendi nessun provider HIRIS li ricava dalle credenziali presenti; dal primo che accendi valgono solo quelli accesi."
  claude_code_oauth_token:
    name: "Provider · Piano Claude Max — token"
    description: "Il token che apre il tuo piano Claude Max. Lo ottieni sulla macchina dove hai gia' Claude Code installato e autenticato, con il comando `claude setup-token`, e incolli qui la stringa che stampa. Senza, l'interruttore qui sopra resta senza effetto e i messaggi mandati sul ponte scadono senza risposta. ATTENZIONE: su questo percorso i consumi NON si misurano — il piano non espone ne' i token ne' il costo della singola risposta, e la pagina Consumi lo dichiara invece di mostrare zeri. Lascialo vuoto se usi solo chiavi API."
  provider_openrouter:
    name: "Provider · OpenRouter"
    description: "Accende OpenRouter: una chiave sola per 200+ modelli (Claude, GPT, Llama, Gemini, Mistral, Qwen, DeepSeek). Serve anche la chiave qui sotto. Come per gli altri: dal primo interruttore che accendi, valgono solo quelli accesi."
  openrouter_api_key:
    name: "Provider · OpenRouter — chiave"
    description: "La chiave di openrouter.ai. Ci sono anche modelli gratuiti (suffisso ':free'): per usarne uno scrivi 'openrouter:fornitore/nome-modello' nel campo modello. PRIVACY: i messaggi passano da OpenRouter (USA) e poi dal fornitore del modello che scegli — openrouter.ai/privacy."
  hide_free_models:
    name: "OpenRouter — nascondi i modelli gratuiti (:free)"
    description: "Toglie i modelli ':free' dagli elenchi della pagina Modelli e delle impostazioni della chat, cosi' non li scegli per sbaglio. Utile se hai credito OpenRouter e preferisci evitare la quota giornaliera bassa e i rate-limit del tier gratuito."
  provider_openai:
    name: "Provider · OpenAI"
    description: "Accende i modelli OpenAI (GPT-4o, o1, ...) come provider. Serve anche la chiave qui sotto. Come per gli altri: dal primo interruttore che accendi, valgono solo quelli accesi."
  openai_api_key:
    name: "Provider · OpenAI — chiave"
    description: "La chiave che paga le risposte OpenAI. Senza, l'interruttore qui sopra resta senza effetto. PRIVACY: i messaggi passano dai server OpenAI (USA) — openai.com/policies."
  provider_ollama:
    name: "Provider · Ollama (sul tuo hardware)"
    description: "Accende un modello Ollama che gira in casa tua: niente cloud, niente costo per risposta. Servono anche l'indirizzo e il nome del modello qui sotto. Con questo come unico provider acceso, HIRIS lavora senza nessuna chiave cloud."
  local_model:
    name: "Ollama — dove sta e quale modello"
    description: "Indirizzo e nome del modello Ollama. Se li lasci vuoti, l'interruttore «Provider · Ollama» qui sopra resta senza effetto."
    url:
      name: "Ollama — indirizzo"
      description: "URL base della tua istanza Ollama, per esempio http://192.168.1.10:11434. All'avvio HIRIS prova a raggiungerla: se non ci riesce lo scrive nel registro e le richieste al modello locale falliranno."
    model:
      name: "Ollama — nome del modello"
      description: "Il modello da usare, per esempio llama3, mistral, phi3. Dev'essere gia' scaricato su quell'istanza: se manca, all'avvio HIRIS lo segnala nel registro."
    request_timeout:
      name: "Ollama — quanto aspettare una risposta (secondi)"
      description: "Passato questo tempo la singola chiamata a Ollama viene abbandonata e la chat mostra un errore. Alzalo se l'hardware e' lento e il modello grande (un Pi 5 con un modello da 9 miliardi di parametri puo' richiedere 240–300 s). Da 10 a 1800, predefinito 120."

  # ── 2. Scelta fra i provider accesi ───────────────────────────────────────
  # `chat_policy` e' uscita con la 2.3.0: era un ordine di backend in CSV che
  # il router scartava sempre (`model_chain` lo sovrascrive). La prova sta in
  # `config.yaml`, blocco 2.
  llm_strategy:
    name: "Ordine di ripiego fra i provider accesi"
    description: "In che ordine HIRIS prova i provider quando ne hai piu' d'uno e il modello e' «auto»: se il primo fallisce passa al successivo. 'balanced' (predefinito) Claude → OpenRouter → OpenAI → Ollama; 'quality_first' Claude → OpenAI → OpenRouter → Ollama; 'cost_first' parte dal locale e dai piu' economici. Riguarda solo i provider accesi. Se nella pagina Modelli di HIRIS hai salvato un ordine tuo, quello vince, e i provider che non nominava vengono messi in coda nell'ordine scelto qui."

  # ── 3. Ponte: la chat sul piano Claude Max ────────────────────────────────
  # I due interruttori sono una decisione sola che indossa due leve: la chat
  # passa dal ponte solo se sono accesi tutti e due, e il piano Claude Max
  # attivo col token li accende entrambi da solo. Finche' restano due, le
  # etichette lo dicono con «1 di 2» / «2 di 2» invece di lasciarlo scoprire.
  bridge_enabled:
    name: "Ponte · accendi la coda (1 di 2)"
    description: "Primo dei due interruttori che portano la chat sul piano Claude Max. Da solo non cambia niente per te: accende la coda che porta i messaggi al runner e la spazzola di quelli scaduti, ma finche' non accendi anche «Ponte · mandaci la chat (2 di 2)» in quella coda non entra nessun messaggio. Servono TUTTI E DUE. Se hai acceso «Provider · Piano Claude Max» e il token c'e', questo risulta gia' acceso da solo: qui non devi toccare niente."
  chat_via_subscription:
    name: "Ponte · mandaci la chat (2 di 2)"
    description: "Secondo dei due interruttori: manda le risposte della chat al runner del piano invece che al provider a consumo, con il tetto giornaliero e la scadenza qui sotto. Da solo non cambia niente: serve acceso anche «Ponte · accendi la coda (1 di 2)» qui sopra. Su questo percorso la chat riceve la conoscenza della casa — il nucleo, ricordi e sessioni precedenti compresi, le stesse cose che sa nell'altra modalita' — e, quando il runner riesce a ricollegarsi a HIRIS, anche i suoi strumenti: puo' cercare fra le entita' e guardare lo stato ADESSO, non solo la fotografia scattata quando il messaggio e' partito, puo' ricordare e richiamare, e puo' far succedere qualcosa in casa — accendere, spegnere, impostare — chiamando un servizio di Home Assistant. Ogni chiamata viene verificata contro la tua installazione prima di partire e lo stato viene riletto dopo, cosi' quello che ti racconta e' quello che e' successo davvero. Non ti viene chiesta nessuna conferma: parte quando glielo chiedi in chat, e mai da sola. Se quel collegamento non riesce risponde lo stesso, con cio' che sa dal nucleo e dalla conversazione, e te lo dice in cima alla risposta invece di far finta di aver guardato — ma in quel caso non puo' nemmeno agire. Sotto la risposta trovi le targhette degli strumenti che ha usato davvero. Se hai acceso «Provider · Piano Claude Max» e il token c'e', questo risulta gia' acceso da solo. Predefinito: spento."
  bridge_deadline_min:
    name: "Ponte · quanto aspettare una risposta (minuti)"
    description: "Se il runner non risponde entro questo tempo il messaggio scade: la chat mostra un errore e il messaggio e' perso. Non c'e' nessun ripiego automatico sul provider a consumo. Da 1 a 120, predefinito 5."
  chat_daily_cap:
    name: "Ponte · quanti messaggi al giorno"
    description: "Superato questo numero di messaggi mandati sul ponte in una giornata, la chat risponde con un errore e il messaggio non parte — di nuovo senza ripiego sul provider a consumo. Conta solo i messaggi passati dal ponte. Attenzione: 0 non vuol dire «illimitato», vuol dire che li blocca tutti. Da 0 a 1000, predefinito 50."

  # ── 4. Aspetto e conservazione ────────────────────────────────────────────
  theme:
    name: "Aspetto — chiaro o scuro"
    description: "Il tema con cui si apre l'interfaccia di HIRIS; 'auto' segue le preferenze del sistema. Vale finche' non usi l'interruttore chiaro/scuro dentro HIRIS: da quel momento, su quel browser, vince la scelta fatta li' e questo campo non ha piu' effetto."
  history_retention_days:
    name: "Per quanti giorni tenere le conversazioni"
    description: "Ogni notte HIRIS cancella i messaggi di chat piu' vecchi di questi giorni. Attenzione, lo stesso numero fa due cose: oltre a cancellare, limita anche quanto HIRIS rilegge della conversazione in corso — abbassarlo non fa solo pulizia, gli fa anche dimenticare prima. 0 = non cancellare mai niente. Da 0 a 3650, predefinito 90."

  # ── 5. Embedding (oggi inattivi) ──────────────────────────────────────────
  # Restano in fondo, con le tecniche: sono dichiarati inerti per decisione del
  # proprietario (la ricerca per somiglianza e' rimandata, non annullata), e
  # dirlo e' l'unico modo di non ripetere l'errore della frase sui documenti
  # sensibili — una promessa che il codice non manteneva.
  memory:
    name: "Embedding — oggi non hanno effetto"
    description: "Provider e modello per la ricerca per somiglianza. OGGI NON FANNO NIENTE: da quando l'integrazione documentale e l'archivio di conoscenza sono usciti, nessuna parte di HIRIS calcola embedding. I due campi restano perche' la ricerca per somiglianza e' una decisione rimandata, non annullata: quando verra' accesa, si configurera' da qui."
    embedding_provider:
      name: "Embedding — provider (inattivo)"
      description: "Quale servizio calcolerebbe gli embedding: 'openai' (serve la chiave API), 'ollama' (serve il server locale), 'model2vec' (tutto in casa, nessun server). Oggi il valore viene letto e mostrato nella pagina Modelli, e nient'altro: nessun testo viene mai vettorizzato."
    embedding_model:
      name: "Embedding — modello (inattivo)"
      description: "Quale modello userebbe. openai: text-embedding-3-small. ollama: nomic-embed-text. model2vec: minishlab/potion-base-8M o potion-base-32M (vuoto = predefinito). Oggi non viene mai invocato."

  # ── 6. Avanzate: registro, sicurezza, diagnostica ─────────────────────────
  # In fondo e col prefisso "Avanzate · " perche' il Supervisor non sa marcare
  # un campo come pericoloso: posizione e nome sono l'unico segnale che si puo'
  # dare. `internal_token` e `supervisor_ingress_cidr` stavano fino alla 2.2.1
  # accanto a «Tema», con lo stesso peso visivo di una preferenza di colore.
  log_level:
    name: "Avanzate · dettaglio del registro"
    description: "Quanto scrive HIRIS nel registro dell'add-on. 'debug' per capire un problema (molto rumoroso), 'info' per l'uso normale, 'warning' o 'error' per tenerlo quasi muto. Se segnali un guasto: mettilo su 'debug', riproduci il problema, allega quello che vedi."
  internal_token:
    name: "Avanzate · token delle API interne"
    description: "Protegge le chiamate a /api/* che non arrivano dall'ingress del Supervisor, fra cui quelle del ponte della chat. LASCIALO VUOTO: al primo avvio HIRIS ne genera uno, lo conserva nei dati dell'add-on e lo riusa a ogni riavvio — non devi farci niente. Scrivine uno tuo solo se un altro componente (per esempio il gateway MCP) deve chiamare la API di HIRIS con un token che decidi tu: in quel caso vince il tuo, e HIRIS non genera ne' scrive nulla."
  supervisor_ingress_cidr:
    name: "Avanzate · reti riconosciute come ingress"
    description: "Solo le richieste che arrivano da questi intervalli IP vengono trattate come vero ingress del Supervisor ed entrano senza token; tutte le altre devono presentare il token interno qui sopra. Allargarlo apre la API di HIRIS a chiunque stia in quelle reti. Predefinito 172.30.32.0/23, la rete Docker del Supervisor; restringilo (per esempio 172.30.32.2/32) se esponi la API a un tunnel."
  debug_expose_port:
    name: "Avanzate · promemoria porta 8099 (solo diagnostica)"
    description: "DA SOLO NON APRE NESSUNA PORTA: scrive soltanto un promemoria nel registro a ogni avvio dell'add-on. Ad aprire davvero la porta e' la sezione Rete piu' in basso in questa pagina (richiede la Modalita' avanzata di HA): imposta '8099/tcp' = 8099, poi Salva e Riavvia. Quando quella porta e' aperta, chiunque sia sulla tua rete locale puo' chiamare /api/* in chiaro, senza HTTPS, con il solo token interno come barriera. Accendilo solo mentre stai diagnosticando, e spegnilo — insieme alla porta in Rete — appena hai finito."
