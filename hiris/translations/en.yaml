configuration:
  # RULE FOR THIS FILE: a description answers ONE question — "what happens if I
  # touch this?". Not what it is, not why it exists, not how we got here, not
  # the edge cases. Ceiling: ~160 characters, two lines on a phone screen.
  #
  # The "why" lives in `config.yaml`'s comments, where the maintainer reads it,
  # not in the form, where whoever is configuring has to wade through it. The
  # full subscription path is in `docs/prova-la-2.0.md`.
  #
  # The NAMES carry the grouping wherever there is no real section: the
  # Supervisor only renders nested dicts on screen (`ponte:`, `local_model:`,
  # `memory:`), and everywhere else the "Provider · " and "Advanced · "
  # prefixes remain. Inside a section the prefix is NOT repeated: the heading
  # already carries it.
  #
  # it/en parity pinned by `tests/test_traduzioni_coprono_le_opzioni.py`, which
  # also pins "not measured" in `claude_code_oauth_token`.

  # ── 1. AI providers ───────────────────────────────────────────────────────
  provider_claude:
    name: "Provider · Claude API (metered)"
    description: "Turns Claude on, paid per use. It also needs the key below. From the first provider you turn on, only those count: turn the others you used back on."
  claude_api_key:
    name: "Provider · Claude API — key"
    description: "Pays for Claude's replies; get it at console.anthropic.com. PRIVACY: your messages and your home's context go through Anthropic (USA)."
  provider_subscription:
    name: "Provider · Claude Max plan (flat rate)"
    description: "Reasons on your Claude Max plan instead of the metered API. With the token below it turns the bridge on by itself: chat, home and memories go there."
  claude_code_oauth_token:
    name: "Provider · Claude Max plan — token"
    description: "Opens the plan; generate it with `claude setup-token`. WARNING: usage here is not measured, and the Claude Max plan's terms apply."
  provider_openrouter:
    name: "Provider · OpenRouter"
    description: "Turns OpenRouter on: one key for 200+ models. It also needs the key below."
  openrouter_api_key:
    name: "Provider · OpenRouter — key"
    description: "Your openrouter.ai key; ':free' models are available too. PRIVACY: messages go through OpenRouter (USA) and the model's own vendor."
  hide_free_models:
    name: "OpenRouter — hide the free (:free) models"
    description: "Removes ':free' models from the lists so you do not pick one by mistake: they have a low daily quota and frequent rate limits."
  provider_openai:
    name: "Provider · OpenAI"
    description: "Turns the OpenAI models (GPT-4o, o1...) on. It also needs the key below."
  openai_api_key:
    name: "Provider · OpenAI — key"
    description: "Pays for OpenAI replies. PRIVACY: your messages go through OpenAI's servers (USA)."
  provider_ollama:
    name: "Provider · Ollama (on your own hardware)"
    description: "Turns on a model running in your own house: no cloud, no per-reply cost. It also needs the address and model below."
  local_model:
    name: "Ollama — where it is and which model"
    description: "Where to find Ollama and which model to use. Left empty, the switch above has no effect."
    url:
      name: "Ollama — address"
      description: "Your instance's address, e.g. http://192.168.1.10:11434. If HIRIS cannot reach it at startup, it says so in the log."
    model:
      name: "Ollama — model name"
      description: "The model to use, e.g. llama3. It must already be pulled there: if it is missing, HIRIS flags it in the log at startup."
    request_timeout:
      name: "Ollama — how long to wait for a reply (seconds)"
      description: "Past this time the call is abandoned and the chat shows an error. Raise it on slow hardware. 10–1800, default 120."

  # ── 2. Choosing between the providers you turned on ───────────────────────
  llm_strategy:
    name: "Fallback order between the providers you turned on"
    description: "The order it tries the providers you turned on when the model is \"auto\": 'balanced' starts at Claude, 'cost_first' local. The Models page wins."

  # ── 3. Bridge: the chat on the Claude Max plan ────────────────────────────
  # Nested under `ponte:` in 2.4.0: it is the only grouping the Supervisor
  # renders on screen. With the section heading carrying it, the "Bridge · "
  # prefix leaves the children's names -- repeating it inside a block already
  # called "Bridge" was exactly the redundancy this work removes. The names
  # still stand on their own.
  #
  # ONE SWITCH ONLY (13 August 2026). There were two, "(1 of 2)" and
  # "(2 of 2)": those markers were the cure for an illness -- two levers that
  # had to be on together -- and they leave with it. Now the name says what
  # the switch DOES, which is what a name is for.
  ponte:
    name: "Bridge — the chat on the Claude Max plan"
    description: "Only needed if you use the Claude Max plan. If the plan is on with its token, the bridge turns itself on and there is nothing to do here."
    attivo:
      name: "Turn the bridge on"
      description: "Sends the chat to the plan's runner instead of the metered provider. There the chat knows and does as much as elsewhere."
    bridge_deadline_min:
      name: "How long to wait for a reply (minutes)"
      description: "Past this time the message expires: an error in chat, no fallback to the metered provider. From 1 to 120, default 5."
    chat_daily_cap:
      name: "How many messages per day"
      description: "Past this many messages a day over the bridge, the chat errors and does not send. Careful: 0 blocks them all, it does not mean unlimited. 0–1000."

  # ── 4. Appearance and retention ───────────────────────────────────────────
  theme:
    name: "Appearance — light or dark"
    description: "The theme HIRIS opens with; 'auto' follows the system. If you then use the light/dark toggle inside HIRIS, that wins in that browser."
  history_retention_days:
    name: "How many days to keep conversations"
    description: "Every night it deletes older messages. The same number also limits how much of the conversation HIRIS reads back: lowering it makes it forget sooner. 0 = never."

  # ── 5. Embeddings (inactive today) ────────────────────────────────────────
  memory:
    name: "Embeddings — no effect today"
    description: "Provider and model for similarity search. They do nothing today: no part of HIRIS computes embeddings."
    embedding_provider:
      name: "Embeddings — provider (inactive)"
      description: "Which service would compute them: openai, ollama, model2vec. Today the value is only read and shown on the Models page."
    embedding_model:
      name: "Embeddings — model (inactive)"
      description: "Which model it would use: text-embedding-3-small, nomic-embed-text, minishlab/potion-base-8M. Today it is never invoked."

  # ── 6. Advanced: log, security, diagnostics ───────────────────────────────
  log_level:
    name: "Advanced · log detail"
    description: "How much HIRIS writes to the log. To report a fault: set 'debug', reproduce the problem, attach what you see."
  internal_token:
    name: "Advanced · internal API token"
    description: "LEAVE IT EMPTY: HIRIS generates one at first startup and reuses it. Write your own only if another component must call its API."
  supervisor_ingress_cidr:
    name: "Advanced · networks recognised as ingress"
    description: "Requests from these networks get in without a token, all others do not. Widening it opens HIRIS's API. Default: the Supervisor's network."
  debug_expose_port:
    name: "Advanced · port 8099 reminder (diagnostics only)"
    description: "BY ITSELF IT OPENS NOTHING: it writes a reminder in the log. What opens the port is the Network section below — and then the LAN sees /api/*."
