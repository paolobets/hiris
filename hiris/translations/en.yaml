configuration:
  claude_api_key:
    name: "Claude API Key"
    description: "API key for Anthropic Claude. Required if you want to use Claude as the AI provider. Get it at console.anthropic.com. PRIVACY: messages and context are sent to Anthropic servers (US) — see anthropic.com/privacy."
  openai_api_key:
    name: "OpenAI API Key"
    description: "API key for OpenAI models (GPT-4o, o1, etc.). Required only if OpenAI is part of your routing strategy/policies. PRIVACY: messages are sent to OpenAI servers (US) — see openai.com/policies."
  openrouter_api_key:
    name: "OpenRouter API Key"
    description: "API key for OpenRouter — a unified proxy giving access to 200+ models (Claude, GPT, Llama, Gemini, Mistral, Qwen, DeepSeek, ...) with one key. Get it at openrouter.ai. Free models are available (':free' suffix, e.g. 'meta-llama/llama-3.3-70b-instruct:free'). To use, set the agent model field to 'openrouter:provider/model-name'. PRIVACY: messages flow through OpenRouter (US) and then to the chosen model's provider — see openrouter.ai/privacy."
  # Gemella italiana in it.yaml (stessa voce): li' c'e' il commento con la
  # ragione del testo aggiunto -- fix I-2/I-3 della review totale della fetta
  # "il ponte riceve il nucleo". Le due descrizioni devono restare
  # semanticamente identiche.
  provider_subscription:
    name: "Enable provider: Subscription (Claude Max)"
    description: "Activate the Claude subscription (Claude Max, via the in-addon runner) as an AI provider. Requires the OAuth token (claude_code_oauth_token). WARNING — what this entails: enabling it with the OAuth token present ROUTES CHAT ONTO THE SUBSCRIPTION BRIDGE, i.e. it turns on \"Chat via subscription — enable\" even if that option is left off. On that path, together with your message, your home's knowledge travels out (the core: areas, entities, what is notable right now, what the home already does by itself) along with the memories of what people have said, past sessions included — under the usage and retention terms of the Claude Max subscription, which differ from those of the pay-per-use API used by the other path. See \"Chat via subscription — enable\" below for what the chat receives on that path. A provider is used only if enabled here AND its credential is set. NOTE: if you leave all provider_* toggles off on an existing install, HIRIS keeps deriving the active providers from the credentials already present (backward-compatible); once you enable ANY provider toggle, only the toggles you turn on are active, so re-enable every provider you want to keep."
  provider_claude:
    name: "Enable provider: Claude API"
    description: "Activate Claude API as an AI provider (requires claude_api_key). A provider is used only if enabled here AND its credential is set. See the note on provider_subscription about enabling toggles on an existing install."
  provider_openai:
    name: "Enable provider: OpenAI API"
    description: "Activate OpenAI API as an AI provider (requires openai_api_key). A provider is used only if enabled here AND its credential is set. See the note on provider_subscription about enabling toggles on an existing install."
  provider_openrouter:
    name: "Enable provider: OpenRouter"
    description: "Activate OpenRouter as an AI provider (requires openrouter_api_key). A provider is used only if enabled here AND its credential is set. See the note on provider_subscription about enabling toggles on an existing install."
  provider_ollama:
    name: "Enable provider: Ollama (local)"
    description: "Activate the local Ollama model as an AI provider (requires local_model url + model). A provider is used only if enabled here AND its credential is set. See the note on provider_subscription about enabling toggles on an existing install."
  hide_free_models:
    name: "Hide :free OpenRouter models"
    description: "When enabled, OpenRouter ':free' models are hidden from the model dropdown on the Models page (#/models) and in the chat settings. Useful if you have purchased OpenRouter credit and prefer to avoid the low daily quota and frequent upstream rate-limits of the free tier."
  llm_strategy:
    name: "LLM Strategy"
    description: "How HIRIS selects models when multiple are available. 'balanced' (default) starts with Claude, then prefers OpenRouter over the dedicated OpenAI slot before falling back to local Ollama. 'cost_first' prefers cheaper/local models first. 'quality_first' always starts with Claude, then OpenAI, then OpenRouter, then Ollama."
  chat_policy:
    name: "Backend policy — chat"
    description: "Backend order for the interactive chat, e.g. claude,ollama — empty = use the strategy."
  local_model:
    name: "Local Model (Ollama)"
    description: "Settings for a locally hosted Ollama model. Leave empty if you do not use Ollama."
    url:
      name: "Ollama URL"
      description: "Base URL of your Ollama instance. Example: http://192.168.1.10:11434"
    model:
      name: "Ollama Model Name"
      description: "Name of the Ollama model to use. Example: llama3, mistral, phi3."
    request_timeout:
      name: "Ollama request timeout (seconds)"
      description: "Maximum wait time for a single Ollama call. Default 120s. Increase for slow hardware running large models (Pi 5 with gemma2:9b may need 240–300s). Range: 10–1800."
  memory:
    name: "Memory & RAG"
    description: "Settings for HIRIS long-term memory and semantic search (RAG). Leave embedding fields empty to disable RAG."
    embedding_provider:
      name: "Embedding Provider"
      description: "Provider for semantic memory embeddings. Options: 'openai' (requires API key), 'ollama' (requires local server), 'model2vec' (fully local, no server, works on all platforms). Leave empty to disable RAG."
    embedding_model:
      name: "Embedding Model"
      description: "Model for generating embeddings. openai: text-embedding-3-small. ollama: nomic-embed-text. model2vec: minishlab/potion-base-8M or potion-base-32M (leave empty for default)."
    rag_k:
      name: "RAG Results (k)"
      description: "Number of relevant memories returned during semantic search. Higher values give more context but increase token usage."
  # fetta E4, bridge repair: see the twin comment in it.yaml. "Leave empty to
  # auto-generate" was a promise no code kept -- with the field empty (the
  # config.yaml default) every non-ingress call got 401 and the chat bridge
  # spun forever. The generation now exists (app/token_interno.py).
  internal_token:
    name: "Internal Token"
    description: "Secret token that secures HIRIS's internal API calls, including the subscription chat bridge. Leave it empty and HIRIS generates one on first start and keeps it in the add-on data: it stays the same across restarts and you need do nothing. Set it by hand only if another component (the MCP gateway, say) must call the HIRIS API with a token you choose: yours then wins, and HIRIS neither generates nor writes anything."
  supervisor_ingress_cidr:
    name: "Trusted Supervisor ingress CIDR"
    description: "Source IP range(s) treated as genuine HA Supervisor ingress for the X-Ingress-Path bypass (CR-1). Everything else needs the internal token. Default 172.30.32.0/23; tighten (e.g. 172.30.32.2/32) if exposing the API to a tunnel."
  log_level:
    name: "Log Level"
    description: "Verbosity of add-on logs. Use 'debug' for troubleshooting, 'info' for normal operation, 'warning' or 'error' for minimal output."
  theme:
    name: "Theme"
    description: "Color theme for the HIRIS web interface. 'auto' follows your system preference."
  history_retention_days:
    name: "Conversation History Retention (days)"
    description: "How many days to keep conversation history before automatic deletion. Default is 90 days."
  # fetta E4, giro di chiusura (voce 2): vedi il commento gemello in it.yaml.
  # «Off = chat via subscription never activates» era falso: _sub_first_class
  # (server.py:907) e' OR-ato in _bridge_enabled (server.py:1332-1335).
  bridge_enabled:
    name: "Subscription bridge — enable"
    description: "Routes chat via subscription (if enabled below) to an external subscription runner instead of the local/pay-per-use provider. NOTE: if you enable the \"Subscription (Claude Max)\" provider and the OAuth token is present, the bridge turns on anyway, even with this option left off."
  bridge_deadline_min:
    name: "Subscription bridge — deadline (minutes)"
    description: "Minutes within which a chat message routed to the external runner must get a reply before expiring (the user sees an error, no automatic fallback). Default: 5."
  # fetta E4, fix della review totale (I2): vedi il commento gemello in it.yaml.
  # La Sentinella (e SENTINEL_DAILY_CAP) e' uscita con la fetta E3 Task 7.
  chat_daily_cap:
    name: "Chat via subscription — messages/day cap"
    description: "Maximum number of chat messages HIRIS routes per day to the external subscription runner. Past the limit the chat replies with an error and the message is not sent: there is no automatic fallback to the local/pay-per-use provider. Only messages routed over the subscription are counted. Default: 50."
  # fetta "il ponte riceve il nucleo" (parita' A, Task 6): vedi il commento
  # gemello in it.yaml, che porta la motivazione per esteso. In breve: la
  # scansione olistica non esiste piu' (E3 Task 4 + E4 Task 8);
  # provider_subscription + token OAuth accendono questa modalita' anche con
  # l'opzione a false (server.py, `_bridge_enabled` letta con `_sub_first_class`);
  # e la chat su questo percorso RICEVE la conoscenza della casa e -- quando la
  # sonda di `runner.py::sonda_strumenti` riesce -- anche i quattro strumenti
  # (parita' B). Il testo copre tutti e due gli stati, perche' li decide una
  # sonda e non una configurazione: quando fallisce, la risposta e' preceduta da
  # `AVVISO_STRUMENTI_ASSENTI`. La descrizione qui sotto e' riscritta insieme a
  # quella di it.yaml, nello stesso commit, come il commento precedente chiedeva.
  chat_via_subscription:
    name: "Chat via subscription — enable"
    description: "Routes chat replies to the external subscription runner instead of the local/pay-per-use provider, subject to the daily cap and deadline above. On this path the chat does receive your home's knowledge — the same core HIRIS uses in the other mode, memories and past sessions included — and, when the runner manages to call back into HIRIS, its four tools as well: it can search your entities and look at the state NOW, not just the snapshot taken when the message was sent, and it can remember and recall. If that call back fails it still answers, from the core and the conversation, and it says so at the top of the reply instead of pretending it looked. It never acts on the home either way: nothing is turned on or off, no automation is touched. The chips under the reply show which tools it actually used. Takes effect only when \"Subscription bridge — enable\" above is also enabled. NOTE: if you enable the \"Subscription (Claude Max)\" provider and the OAuth token is present, this mode turns on anyway, even with this option left off. Default: disabled."
  # fetta «fix pre-UAT»: gemella italiana in it.yaml (stessa voce), dove sta
  # il commento con la ragione. In breve: claude_code_oauth_token era in
  # config.yaml (options + schema) ma senza traduzione in NESSUNA delle due
  # lingue -- nel Supervisor compariva senza etichetta ne' descrizione, ed e'
  # il campo che accende il percorso abbonamento. Le due descrizioni devono
  # restare semanticamente identiche.
  claude_code_oauth_token:
    name: "Claude Code OAuth token (subscription)"
    description: "OAuth token of the Claude subscription (Claude Max) that lets HIRIS reason without spending pay-per-use API credit. This is the field that turns on the subscription path: set it AND enable \"Enable provider: Subscription (Claude Max)\" above — with both present, chat is routed over the subscription even with \"Subscription bridge — enable\" and \"Chat via subscription — enable\" left off. Get it on the machine where you already have Claude Code installed and authenticated, with the `claude setup-token` command, and paste here the string it prints. WARNING: on this path usage is NOT measured — the subscription exposes neither the tokens nor the cost of an individual reply, and the Usage page says so instead of showing zeros — and the usage and retention terms of the Claude Max subscription apply, which differ from those of the pay-per-use API. Leave it empty if you only use API keys."
  mayan:
    name: "Mayan EDMS (documents)"
    description: "Settings for ingesting documents from Mayan EDMS into the second brain. Leave url/token empty to disable. tag_id must be > 0 to enable polling."
    url:
      name: "Mayan URL"
      description: "Base URL of the Mayan EDMS API v4. Example: http://192.168.1.31:8090/api/v4"
    token:
      name: "Mayan API Token"
      description: "API token for Mayan authentication. Generate it in Mayan → Account → API Tokens."
    tag_id:
      name: "Tag ID"
      description: "ID of the Mayan tag to ingest (e.g. the 'HIRIS' tag). Set to 0 to disable ingestion."
    sensitivity:
      name: "Document Sensitivity"
      description: "Privacy level for ingested documents. 'sensitive' (default, recommended for bank statements, invoices) hides content from cloud AI. 'normal' allows full RAG recall."
    poll_minutes:
      name: "Poll Interval (minutes)"
      description: "How often HIRIS polls Mayan for new documents. Default 60. Range: 5–1440."
  debug_expose_port:
    name: "🛠 Debug — expose port warning (DEV ONLY, does NOT open the port by itself)"
    description: >-
      ⚠️ This toggle by ITSELF does NOT open port 8099 — it only logs a
      warning at every addon startup as a reminder. To actually expose the
      port on the LAN you must ALSO go to Settings → Add-ons → HIRIS →
      Configuration → Network (below this section, requires HA Advanced
      Mode) and map '8099/tcp' = 8099, then Save + Restart. ENABLE ONLY FOR
      DEV/DIAGNOSTICS. Disable this toggle and clear the Network port
      mapping when done. Without HTTPS, anyone on the LAN can call /api/*
      (only internal_token as a barrier). DO NOT leave enabled in
      production.

