<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIRIS — Configurazione</title>
  <link rel="icon" type="image/svg+xml" href="static/hiris-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/hiris-theme.css">
  <script>
    (function() {
      try {
        var qp = new URL(window.location).searchParams.get('theme');
        if (qp === 'light' || qp === 'dark') {
          document.documentElement.setAttribute('data-theme', qp);
          return;
        }
        var saved = localStorage.getItem('hiris-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="static/hiris-config-override.css">
  <link rel="stylesheet" href="static/hiris-config.css">
</head>
<body>

    <a class="nav-item" href="#/models" data-route="models">

  <template id="tpl-page-chrome">
    <button class="cfg-menu-btn" id="cfg-menu-btn" aria-label="Apri menu" title="Menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="crumb">
      <span>casa</span>
      <span class="seg">›</span>
      <span class="here" id="chrome-here">…</span>
    </div>
    <div class="chrome-actions">
      <button class="btn-icon-only" id="theme-toggle" title="Cambia tema" aria-label="Cambia tema chiaro/scuro">
        <svg id="ic-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="visibility:hidden"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="ic-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="visibility:hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </template>

  <!-- SP-4 Fase B Task 4: le section-card + il rail anchor-nav non sono più
       scritte qui a mano -- erano duplicate 3 volte (qui, l'<aside>, e i
       letterali sc-body-* nei populate*() di chatbot-editor.js). Ora
       chatbot-editor.js le genera entrambe da un unico array SECTIONS
       (buildSections()); questo template porta solo la cornice: il
       contenitore .editor-content (con la sola sticky-actions-wrap, dentro
       cui le section-card vengono inserite PRIMA a runtime) e l'<aside>
       anchor-nav vuoto (con la sola label statica "Indice"). -->
  <template id="tpl-agent-editor">
    <div class="editor-grid">
      <div class="editor-content">
        <!-- v0.10.8: sticky-actions con wrap pattern. Outer wrap fixed full-width
             (background+blur+border-top). Inner box max-width centrato simmetrico
             a page-main. Layout: Annulla left | spacer | TestRun/Elimina/Salva right.
             Stato salvataggio indicato dal solo bottone Salva (disabled = saved,
             enabled = pending). Niente più "Salvato ✓" text inline. -->
        <div class="sticky-actions-wrap" id="sticky-actions-wrap">
          <div class="sticky-actions" id="sticky-actions">
            <button class="btn btn-ghost" id="btn-cancel">Annulla</button>
            <span class="sa-spacer"></span>
            <button class="btn" id="btn-test-run"><span class="spinner"></span>▶ Test Run</button>
            <button class="btn btn-danger" id="btn-delete" style="display:none">Elimina</button>
            <button class="btn btn-primary" id="btn-save" disabled>Salva</button>
          </div>
        </div>
      </div>
      <aside class="anchor-nav" id="anchor-nav">
        <div class="an-label">Indice</div>
      </aside>
    </div>
  </template>

  <!-- Drawer + Popover container (mounted by atom modules in Phase 3) -->
  <div id="drawer-container"></div>
  <div id="popover-container"></div>

  <!-- Scripts — ordine di dipendenze reali (SP-4 Fase B Task 2: collassato
       il loader dinamico di chatbot-editor.js. I 7 file sotto erano prima
       iniettati a runtime dopo il mount, con rewire manuale dei listener a
       ogni remount — vedi docs/design/2026-07-28-piano-SP4b1-cornice-
       unificata.md Task 2. Ora sono <script src> statici come tutti gli
       altri: ognuno viene fingerprintato individualmente da _inject_version
       (server.py), quindi il cache-busting per-file torna corretto "gratis".
       state → router → api → entity-picker → templates → permessi →
       log-row → logs → usage → proposals → drawer → popover →
       chatbot-editor → (route) → main. -->
  <script src="static/config/state.js"></script>
  <script src="static/config/router.js"></script>
  <script src="static/config/api.js"></script>
  <!-- SP-4 Fase B Task 1: entity-picker.js sostituisce il selettore entità
       singleton di permessi.js (istanziabile, serve l'editor Chatbot ora e
       l'editor Agentbot in seguito, che ne userà tre per riga). Usa escHtml
       (api.js) — deve caricare dopo api.js e prima di chatbot-editor.js,
       che lo istanzia in populateScope(). -->
  <script src="static/config/entity-picker.js"></script>
  <!-- SP-4 Fase B Task 3: kit editor condiviso (fabbriche di campo, select
       modello con fetch cachata, checkGroup, dirty tracking reale + guard di
       navigazione, save bar). Deve caricare prima di permessi.js (assorbe
       buildToolChecks/buildActionChecks), chatbot-editor.js (usa checkGroup/
       modelSelect/dirty/saveBar) e agentbot-route.js (modelSelect cachato). -->
  <script src="static/config/editor-kit.js"></script>
  <script src="static/config/templates.js"></script>
  <script src="static/config/permessi.js"></script>
  <script src="static/config/log-row.js"></script>
  <script src="static/config/logs.js"></script>
  <script src="static/config/usage.js"></script>
  <script src="static/config/proposals.js"></script>
  <!-- SP-4 Fase B Task 4: chatbot-form.js è stato assorbito integralmente in
       chatbot-editor.js (unico owner di load+payload: openAgent/buildPayload/
       loadChatbots) ed eliminato. -->
  <!-- drawer/popover: atomi UI generici, devono caricare prima di
       chatbot-editor.js (che li usa) ma dopo i moduli Persona sopra. -->
  <script src="static/config/drawer.js"></script>
  <script src="static/config/popover.js"></script>
  <script src="static/config/chatbot-editor.js"></script>
  <script src="static/config/dashboard.js"></script>
  <script src="static/config/chatbots-list.js"></script>
  <script src="static/config/proposals-route.js"></script>
  <script src="static/config/usage-route.js"></script>
  <script src="static/config/models-route.js"></script>
  <script src="static/config/tasks-route.js"></script>
  <script src="static/config/gateway-route.js"></script>
  <script src="static/config/history-route.js"></script>
  <script src="static/config/agentbot-route.js"></script>
  <script src="static/config/main.js"></script>
</body>
</html>
