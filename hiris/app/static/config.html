<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIRIS — Configurazione</title>
  <link rel="icon" type="image/svg+xml" href="static/hiris-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/hiris-theme.css">
  <script>
    (function() {
      try {
        var qp = new URL(window.location).searchParams.get('theme');
        if (qp === 'light' || qp === 'dark') {
          document.documentElement.setAttribute('data-theme', qp);
          return;
        }
        var saved = localStorage.getItem('hiris-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="static/hiris-config-override.css">
  <link rel="stylesheet" href="static/hiris-config.css">
</head>
<body>
  <div class="app-shell">
    <aside class="side-nav" id="side-nav"></aside>
    <div class="sidenav-overlay" id="sidenav-overlay" style="display:none"></div>
    <main>
      <header class="page-chrome" id="page-chrome"></header>
      <div class="page-main" id="route-outlet"></div>
    </main>
  </div>

  <template id="tpl-side-nav">
    <div class="brand">
      <img src="static/hiris-icon.svg" alt="HIRIS">
      <span class="brand-name">HIRIS<small id="hc-version-side"></small></span>
    </div>
    <!-- v0.10.8: Chat in cima, sotto brand, sopra label Configurazione.
         Icona speech-bubble appropriata. Rimossa duplicate voce in fondo.
         Ogni voce porta `title` E `aria-label` con le stesse parole della sua
         `.nav-label`: sotto i 1024 px la barra si stringe a 64 px e le
         etichette spariscono (hiris-config.css), lasciando sei icone senza un
         nome ne' per il mouse ne' per uno screen reader. Il nome vive qui,
         accanto al testo che lo ripete, cosi' i due non possono divergere. -->
    <a class="nav-item" href="./" title="Chat con HIRIS" aria-label="Chat con HIRIS">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </span>
      <span class="nav-label">Chat</span>
    </a>
    <div class="nav-section-label">Configurazione</div>
    <!-- fetta E5 Task 8: la home della configurazione non e' piu' la
         "Dashboard" del prodotto vecchio (chatbot da creare, proposte,
         gateway): e' «Cosa HIRIS sa», la faccia di GET /api/casa e
         GET /api/nucleo. Il badge `#nav-adv-count` che stava qui contava le
         segnalazioni del Brain leggendo una rotta uscita con la fetta E3, e
         mostrava `0` quando la rotta rispondeva 404: e' uscito con la sua
         fonte, vedi config/main.js. -->
    <a class="nav-item" href="#/" data-route="conoscenza" title="Cosa HIRIS sa" aria-label="Cosa HIRIS sa">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H11v18H5.5A2.5 2.5 0 0 1 3 18.5z"/><path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H13v18h5.5a2.5 2.5 0 0 0 2.5-2.5z"/></svg>
      </span>
      <span class="nav-label">Cosa HIRIS sa</span>
    </a>
    <!-- fetta E5 Task 9: sostituisce il pannello Memoria della chat, che
         interrogava la coda di approvazione di knowledge_store -- vuota per
         costruzione da mesi e, dalla fetta "esce il documentale", uscita del
         tutto insieme all'archivio. Qui si guarda e si corregge l'archivio
         vero (GET/PATCH/DELETE /api/memoria*). -->
    <a class="nav-item" href="#/memoria" data-route="memoria" title="Memoria" aria-label="Memoria">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h5M8 13h3"/></svg>
      </span>
      <span class="nav-label">Memoria</span>
    </a>
    <!-- fetta E5 Task 2: i sette campi di ImpostazioniChat (prompt di
         sistema, modello, forma della risposta, ragionamento, tetto di turni,
         restrizione alla casa, nome) prima si cambiavano solo scrivendo a
         mano /data/impostazioni_chat.json. E' l'unico posto in cui si
         configura la chat da quando il Task 6 di questa fetta ha fatto
         uscire l'editor #/chatbots. -->
    <a class="nav-item" href="#/impostazioni" data-route="impostazioni" title="Impostazioni chat" aria-label="Impostazioni chat">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </span>
      <span class="nav-label">Impostazioni chat</span>
    </a>
    <a class="nav-item" href="#/usage" data-route="usage" title="Consumi" aria-label="Consumi">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h7v7"/></svg>
      </span>
      <span class="nav-label">Consumi</span>
    </a>
    <a class="nav-item" href="#/models" data-route="models" title="Modelli" aria-label="Modelli">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><circle cx="8" cy="7" r="0.8" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="nav-label">Modelli</span>
    </a>
    <!-- fetta "esce il documentale": qui c'era la voce Storicizzazione
         (#/history). La pagina configurava quali entita' HIRIS registrava
         nel proprio storico; quello storico alimentava solo il digest delle
         04:00, che scriveva in un archivio di conoscenza che nessuno
         rileggeva. La cronaca della casa la tiene Home Assistant. -->
    <!-- v0.10.8: rimossi nav-spacer + voce duplicata "Vai alla chat" in fondo
         (icona luna sbagliata + duplicava il link Chat ora in cima alla sidebar). -->
  </template>

  <template id="tpl-page-chrome">
    <button class="cfg-menu-btn" id="cfg-menu-btn" aria-label="Apri menu" title="Menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="crumb">
      <span>casa</span>
      <span class="seg">›</span>
      <span class="here" id="chrome-here">…</span>
    </div>
    <div class="chrome-actions">
      <button class="btn-icon-only" id="theme-toggle" title="Cambia tema" aria-label="Cambia tema chiaro/scuro">
        <svg id="ic-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="visibility:hidden"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="ic-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="visibility:hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </template>

  <!-- Scripts — ordine di dipendenze reali. Ogni file e' fingerprintato
       individualmente da _inject_version (server.py), quindi il cache-busting
       per-file e' automatico.
       state → router → api → (route) → main.
       fetta E5 Task 8: `labels.js` e `proposals-core.js` stavano qui in mezzo,
       e la loro unica ragione di esistere era la vecchia Dashboard (lo
       dichiarava questo stesso commento: «unico consumatore rimasto:
       dashboard.js»). Con la riscrittura di dashboard.js sono rimasti senza
       nessun consumatore -- e i loro soggetti erano gia' morti: le severita'
       delle segnalazioni del Brain e le azioni su /api/proposals*, rotte
       uscite con la fetta E3. Sono usciti col loro ultimo chiamante. -->
  <script src="static/config/state.js"></script>
  <script src="static/config/router.js"></script>
  <script src="static/config/api.js"></script>
  <script src="static/config/dashboard.js"></script>
  <script src="static/config/usage-route.js"></script>
  <script src="static/config/models-route.js"></script>
  <!-- fetta E5 Task 2: pagina #/impostazioni. Nessuna dipendenza (usa solo
       document e fetch), quindi la sua posizione nell'ordine non vincola
       niente: sta accanto a models-route.js perche' e' l'altra pagina che
       parla di modelli. -->
  <script src="static/config/impostazioni-route.js"></script>
  <!-- fetta E5 Task 9: pagina #/memoria. Nessuna dipendenza (solo document e
       fetch, stesso pattern di impostazioni-route.js), quindi la posizione
       nell'ordine non vincola niente. -->
  <script src="static/config/memoria-route.js"></script>
  <script src="static/config/main.js"></script>
</body>
</html>
