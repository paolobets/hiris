name: "HIRIS"
version: "3.0.0"
slug: "hiris"
description: >-
  Home Intelligent Reasoning & Integration System.
  HIRIS knows your home and acts on it when you ask: it builds a living picture
  of your floors, areas, devices, entities and of what your automations and
  scripts already do, and gives you one chat to ask it and to command it.
  Service calls are checked against your own installation before they are sent
  and the state is read back after, so it tells you what actually happened.
  It never acts on its own: every action starts from a sentence you type.
  It does not write automations, scripts, scenes or dashboards - but it calls
  services, and that includes switching an automation on or off, or sending a
  notification if your installation exposes notify entities.
url: "https://github.com/paolobets/hiris"
homeassistant: "2024.7.0"
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:home-automation
panel_title: HIRIS
startup: services
init: false
map:
  - config:rw
hassio_api: true
homeassistant_api: true
# v0.10.11: porta 8099 esponibile via HA UI per debug remoto (sviluppo,
# diagnostica). Default `null` = NON esposta. L'utente imposta la host port
# nella sezione Network di HA UI per attivare il binding host→container.
#
# Versione B (3.0.0): l'opzione `debug_expose_port` e' USCITA. Non apriva
# niente -- il suo unico effetto era stampare sette righe nel registro che
# spiegavano come aprire la porta a mano, cioe' un promemoria travestito da
# comando, con zero lettori nel codice. Il meccanismo vero e' questo blocco
# `ports:`, che resta: la porta si apre e si chiude di qui.
ports:
  "8099/tcp": null
ports_description:
  "8099/tcp": >-
    HIRIS API (DEBUG) — imposta a 8099 SOLO durante sessioni dev/diagnostica:
    da quel momento chiunque sulla LAN puo' chiamare /api/* in HTTP, protetto
    solo da «Avanzate · token delle API interne». Lascia vuoto in produzione.

# ===========================================================================
# QUESTA PAGINA CUSTODISCE, NON DECIDE (versione B, 3.0.0).
#
# Quattordici opzioni sono uscite da qui con questa versione -- i cinque
# interruttori `provider_*`, `llm_strategy`, `hide_free_models`, le tre del
# blocco `ponte:`, `local_model.model` e `local_model.request_timeout` -- piu'
# `history_retention_days` e `debug_expose_port`. Non sono state cancellate:
# le decisioni che rappresentavano si prendono adesso dove si vedono, cioe'
# nella pagina Modelli di HIRIS e in «Impostazioni chat». Il valore che
# l'utente aveva e' stato copiato nell'archivio di HIRIS dalla versione
# precedente (la 2.5.0, «versione A» della migrazione), che per questo NON si
# poteva saltare: il Supervisor scarta ogni chiave fuori schema PRIMA di
# scrivere /data/options.json (`supervisor/apps/options.py::
# AddonOptions.__call__`), quindi nessun ripiego in run.sh puo' recuperare il
# valore di un'opzione appena tolta.
#
# Cio' che resta qui e' cio' che si CUSTODISCE: le quattro credenziali,
# l'indirizzo di Ollama, e le tre voci avanzate che governano il perimetro
# d'accesso. Piu' `theme` e i due campi `memory.*`, dichiarati inerti: sono
# rimasti deliberatamente, perche' toglierli avrebbe fatto perdere il valore
# salvato in cambio di niente.
#
# L'ORDINE DI QUESTO FILE E' LA PAGINA CHE L'UTENTE VEDE. Il Supervisor non sa
# rendere separatori ne' campi condizionali, e i commenti `# ── N.` di questo
# file li vede solo chi apre il file. L'unica sezione che rende a schermo e' il
# dizionario annidato (`local_model:`, `memory:`) -- che pero' fa parte del
# NOME dell'opzione: annidare una voce piatta ne cambia la chiave, e il
# Supervisor NON migra i valori. Percio' si annida solo dove perdere il valore
# costa poco, e tutto il resto si raggruppa per VICINANZA e per PREFISSO
# dell'etichetta ("Provider · ", "Avanzate · ").
#
# `options:` e `schema:` sono tenuti nello STESSO ordine, per due ragioni: il
# Supervisor costruisce il modulo dallo `schema:` (itera le chiavi nell'ordine
# del file), e chi legge questo file deve poter confrontare i due blocchi riga
# per riga. Se li riordini, riordinali insieme.
# ===========================================================================

options:
  # ── 1. Le credenziali dei provider ────────────────────────────────────────
  # Qui c'erano anche i cinque interruttori `provider_*`, uno sopra ogni
  # credenziale. Sono usciti con la versione B: un provider e' usato se e solo
  # se sta in CATENA, e la catena si compone nella pagina Modelli di HIRIS.
  # Un interruttore qui sarebbe una seconda rappresentazione dello stesso
  # fatto -- ed e' la seconda rappresentazione che permetteva alla pagina di
  # mentire.
  #
  # L'ordine e' quello in cui HIRIS ripiegava con la strategia `balanced`, che
  # resta l'ordine in cui la pagina Modelli propone il preset omonimo.
  claude_api_key: ""
  # Il token del piano Claude Max, per esteso. Sul percorso del piano,
  # insieme al messaggio, viaggiano la conoscenza della casa (il nucleo: aree,
  # entita', cosa e' notevole adesso, cosa la casa fa da sola) e i ricordi di
  # cio' che le persone hanno detto, sessioni precedenti comprese -- sotto le
  # condizioni d'uso e di conservazione del piano Claude Max, DIVERSE da
  # quelle dell'API a consumo. E i consumi non si misurano: il piano non
  # espone ne' i token ne' il costo della singola risposta (la pagina Consumi
  # lo dichiara invece di mostrare zeri).
  #
  # Il token da solo NON accende piu' il ponte (versione B). Fino alla 2.5.0
  # `provider_subscription` acceso col token lo implicava, e quell'implicazione
  # era l'ultima seconda-rappresentazione rimasta: il ponte risultava acceso
  # mentre `ponte.attivo` diceva di no, e la pagina Modelli leggeva un valore
  # che l'archivio non conteneva. Adesso il ponte ha un valore solo,
  # `ponte.attivo` nell'archivio di HIRIS, e si accende dalla pagina Modelli --
  # dove c'e' anche il bottone che ce lo mette in un gesto. Chi aggiorna con il
  # token presente e il ponte spento se lo sente dire all'avvio, nel registro
  # dell'add-on, e lo legge in cima alla pagina Modelli.
  claude_code_oauth_token: ""
  openrouter_api_key: ""
  openai_api_key: ""
  # `local_model.model` e `local_model.request_timeout` sono uscite con la
  # versione B: il modello e l'attesa di Ollama si decidono nella riga di
  # Ollama, nella pagina Modelli. Qui resta l'INDIRIZZO, che e' cio' che si
  # custodisce. Il blocco annidato resta annidato: togliere la nidificazione
  # cambierebbe la chiave di `url` e ne farebbe perdere il valore.
  local_model:
    url: ""

  # ── 2. Aspetto ────────────────────────────────────────────────────────────
  # `theme` e' solo il tema d'apertura: `static/config/api.js::applyTheme` legge
  # `localStorage['hiris-theme']` PRIMA di `api/config`, quindi appena l'utente
  # tocca l'interruttore chiaro/scuro dentro HIRIS questa opzione non ha piu'
  # effetto su quel browser.
  #
  # Qui viveva anche `history_retention_days`, uscita con la versione B: i
  # giorni di conservazione delle conversazioni si cambiano in «Impostazioni
  # chat», dentro HIRIS, dove si vede anche il secondo lavoro che quel numero
  # fa (quanto HIRIS rilegge della conversazione in corso).
  theme: "auto"

  # ── 3. Embedding (oggi inattivi) ──────────────────────────────────────────
  # Fetta "esce il documentale": esce `rag_k` (era il k del richiamo per
  # somiglianza sull'archivio di conoscenza, uscito con la fetta). I due campi
  # che restano sono letti da `server.py` per costruire il provider, ma
  # DICHIARATI INERTI: nessun percorso di HIRIS chiama piu' `embed()`. Restano
  # perche' "se e quando accendere i vettori" e' una decisione rimandata dal
  # contratto, non annullata -- e perche' toglierli costerebbe la perdita del
  # valore salvato in cambio di niente.
  memory:
    embedding_provider: ""
    embedding_model: ""

  # ── 4. Avanzate: registro, sicurezza ──────────────────────────────────────
  # In fondo e con il prefisso "Avanzate · " nell'etichetta perche' il
  # Supervisor non sa marcare un campo come pericoloso: la posizione e il nome
  # sono l'unico segnale disponibile.
  # NON annidate, deliberatamente (2.4.0): `supervisor_ingress_cidr` azzerata
  # torna al default, che e' PIU' LARGO di qualunque valore ristretto a mano --
  # un allargamento silenzioso del perimetro d'accesso; e `internal_token`
  # azzerato viene rigenerato, il che rompe senza dirlo chi ha integrato il
  # gateway MCP con un token deciso da lui. Una sezione a schermo non vale una
  # regressione di sicurezza che nessuno vede accadere.
  log_level: "info"
  # Vuoto e' il default VOLUTO: all'avvio HIRIS genera il token e lo conserva
  # in /data (app/token_interno.py), cosi' sopravvive ai riavvii. Valorizzarlo
  # a mano serve solo a imporre un token deciso da chi integra HIRIS con altri
  # componenti: in quel caso vince il valore scritto qui.
  internal_token: ""
  # CR-1: CIDR sorgenti fidate per il bypass-ingress (X-Ingress-Path). Solo le
  # richieste da questi range sono trattate come ingress del Supervisor; tutto
  # il resto richiede internal_token. Default = rete Docker standard del
  # Supervisor. Restringi (es. 172.30.32.2/32) se esponi la API a un tunnel.
  supervisor_ingress_cidr: "172.30.32.0/23"

  # ── Opzioni uscite, e perche' ─────────────────────────────────────────────
  # fetta E3 Task 7: escono `sentinel_daily_cap`/`sentinel_cooldown_min` --
  # la Sentinella (guardiano/ragionatore/esecutore) che li leggeva e' uscita
  # per intero (`sentinel_ronda_min` era gia' uscito con la ronda, Task 4).
  # fetta E3 Task 6: esce `brain_notify_high` -- la scansione di salute che
  # notificava e l'AdvisoryStore che le segnalazioni le persisteva sono
  # entrambi usciti col Brain che parlava (resoconto, solleciti, scansione).
  # fetta E3 Task 13: esce `apprise_urls` -- notifiche.py, il suo unico
  # lettore, e' uscito per intero insieme alle altre cinque strade per dire
  # una cosa a una persona. `HA_NOTIFY_SERVICE`/`RETROPANEL_URL` non erano
  # opzioni add-on (mai un export in run.sh): escono con lui, dal codice.
  # fetta "esce il documentale" (decisione del proprietario, 12 agosto 2026):
  # esce il blocco `mayan.*` (url, token, tag_id, sensitivity, poll_minutes).
  # Il connettore Mayan, l'archivio di conoscenza in cui ingeriva e la cattura
  # dello storico che scriveva nello stesso posto sono usciti tutti: non c'era
  # nessun lettore di produzione a valle. `sensitivity` prometteva inoltre di
  # "nascondere il contenuto all'AI cloud" e non lo faceva: la
  # pseudonimizzazione era inerte da mesi.
  # fetta "la pagina di configurazione" (13 agosto 2026): esce `chat_policy`.
  # Era un ordine di backend in CSV che il router scartava a ogni costruzione
  # (`model_chain` lo sovrascrive sempre): un campo che l'utente poteva
  # compilare senza che succedesse mai niente.
  # fetta «la catena diventa l'unica verita'», versione B (3.0.0): escono le
  # QUATTORDICI righe di cui sopra -- `provider_claude`,
  # `provider_subscription`, `provider_openrouter`, `provider_openai`,
  # `provider_ollama`, `llm_strategy`, `hide_free_models`, `ponte.attivo`,
  # `ponte.bridge_deadline_min`, `ponte.chat_daily_cap`, `local_model.model`,
  # `local_model.request_timeout`, `history_retention_days` e
  # `debug_expose_port`. Le prime dodici sono DECISIONI, e si prendono dove si
  # vedono; `history_retention_days` sta in «Impostazioni chat»; e
  # `debug_expose_port` non decideva niente affatto.

schema:
  # ── 1. Le credenziali dei provider ────────────────────────────────────────
  claude_api_key: password
  claude_code_oauth_token: password
  openrouter_api_key: password
  openai_api_key: password
  local_model:
    url: str

  # ── 2. Aspetto ────────────────────────────────────────────────────────────
  theme: "list(light|dark|auto)"

  # ── 3. Embedding (oggi inattivi) ──────────────────────────────────────────
  memory:
    embedding_provider: str
    embedding_model: str

  # ── 4. Avanzate: registro, sicurezza ──────────────────────────────────────
  log_level: "list(debug|info|warning|error)"
  internal_token: password
  supervisor_ingress_cidr: "str?"
