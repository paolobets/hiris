name: "HIRIS"
version: "1.1.0-beta.17"
slug: "hiris"
description: >-
  Home Intelligent Reasoning & Integration System.
  AI-powered agent platform for smart home management.
  Combines Claude AI reasoning with Home Assistant automation.
url: "https://github.com/paolobets/hiris"
homeassistant: "2023.1.0"
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:home-automation
panel_title: HIRIS
startup: services
init: false
map:
  - config:rw
hassio_api: true
homeassistant_api: true
# v0.10.11: porta 8099 esponibile via HA UI per debug remoto (sviluppo,
# diagnostica). Default `null` = NON esposta. User imposta host port nella
# sezione Network di HA UI per attivare il binding host→container.
# Inoltre l'opzione debug_expose_port deve essere attivata per logging
# warning + ricordare il rischio di esposizione su LAN senza HTTPS.
ports:
  "8099/tcp": null
ports_description:
  "8099/tcp": >-
    HIRIS API (DEBUG) — imposta a 8099 e abilita debug_expose_port nelle
    opzioni SOLO durante sessioni dev/diagnostica. Lascia vuoto in produzione.

options:
  # ── AI Providers ──────────────────────────────────────────────────────────
  claude_api_key: ""
  openai_api_key: ""
  openrouter_api_key: ""
  # ── Attivazione provider (SP-2) ───────────────────────────────────────────
  # Un provider è usato solo se attivo E con credenziale. Se lasci tutti a
  # false su un install esistente, HIRIS deriva gli attivi dalle credenziali
  # già presenti (retro-compat).
  provider_subscription: false
  provider_claude: false
  provider_openai: false
  provider_openrouter: false
  provider_ollama: false
  hide_free_models: false
  llm_strategy: "balanced"
  automatic_policy: ""
  chat_policy: ""

  # ── Local Model (Ollama) ──────────────────────────────────────────────────
  local_model:
    url: ""
    model: ""
    request_timeout: 120

  # ── MQTT ─────────────────────────────────────────────────────────────────
  mqtt:
    host: ""
    port: 1883
    user: ""
    password: ""

  # ── Memory & RAG ──────────────────────────────────────────────────────────
  memory:
    embedding_provider: ""
    embedding_model: ""
    rag_k: 5

  # ── General ───────────────────────────────────────────────────────────────
  internal_token: ""
  # ── Execute-API (MCP gateway) ─────────────────────────────────────────────
  # Allowlist server-side dei tool eseguibili via POST /api/execute (gated da
  # internal_token). Vuoto = nessun tool esposto (fail-closed). Le whitelist
  # entità/servizi (glob CSV, es. light.*) vincolano ulteriormente il gateway.
  execute_api_tools: ""
  execute_api_entities: ""
  execute_api_services: ""
  # Denylist di LETTURA del gateway: glob CSV su entity_id che non escono mai
  # da /api/execute, comunque li si chieda (richiesta rifiutata in ingresso,
  # risposta potata in uscita). Non e' l'elenco dei domini pericolosi del
  # semaforo, che riguarda l'azione: una tapparella e' pericolosa da muovere ma
  # innocua da leggere, una telecamera e' l'opposto. Svuotala per tornare al
  # comportamento precedente (ogni lettura vede tutta la casa).
  execute_api_read_denylist: "lock.*, alarm_control_panel.*, camera.*, person.*, device_tracker.*"
  # Server MCP interno (loopback-only, non esposto in rete): porta locale su
  # cui HIRIS espone i tool MCP per client MCP-aware. Mai raggiungibile fuori
  # da 127.0.0.1 dentro il container.
  internal_mcp_port: 8199
  # CR-1: CIDR sorgenti fidate per il bypass-ingress (X-Ingress-Path). Solo le
  # richieste da questi range sono trattate come ingress del Supervisor; tutto
  # il resto richiede internal_token. Default = rete Docker standard del
  # Supervisor. Restringi (es. 172.30.32.2/32) se esponi la API a un tunnel.
  supervisor_ingress_cidr: "172.30.32.0/23"
  log_level: "info"
  theme: "auto"
  apprise_urls: []
  history_retention_days: 90

  # ── Sentinella (knobs) ────────────────────────────────────────────────────
  sentinel_daily_cap: 20
  sentinel_cooldown_min: 30
  sentinel_allow_green_auto: false
  sentinel_ronda_min: 15
  agent_owner: ""

  # ── Brain (salute del sistema) ───────────────────────────────────────────
  # Notifica push quando la scansione di salute apre, riapre o aggrava fino a
  # grave una segnalazione. Solo severita' alta, e mai due volte per lo stesso
  # problema entro 12 ore: la scansione gira ogni 30 minuti e ri-notificare
  # sarebbe rumore. Metti a false per non riceverle: le segnalazioni restano
  # comunque visibili.
  brain_notify_high: true

  # ── Ponte push (knobs) ────────────────────────────────────────────────────
  bridge_enabled: false
  bridge_deadline_min: 5
  bridge_fallback: true
  chat_daily_cap: 50
  chat_via_subscription: false
  claude_code_oauth_token: ""

  # ── Mayan EDMS (documenti) ────────────────────────────────────────────────
  mayan:
    url: ""            # es. http://192.168.1.31:8090/api/v4
    token: ""          # API token Mayan
    tag_id: 0          # id del tag "HIRIS" da ingerire (0 = disabilitato)
    sensitivity: "sensitive"
    poll_minutes: 60

  # ── Debug ─────────────────────────────────────────────────────────────────
  # v0.10.11: toggle che logga warning quando il port mapping host (Network)
  # è abilitato. Esponendo HIRIS direttamente sulla LAN, qualsiasi client
  # locale può raggiungere /api/* (protetto solo da internal_token se settato).
  # USA SOLO PER DEV/DIAGNOSTICA. Disattiva quando finito.
  debug_expose_port: false

schema:
  # ── AI Providers ──────────────────────────────────────────────────────────
  claude_api_key: password
  openai_api_key: password
  openrouter_api_key: password
  provider_subscription: bool?
  provider_claude: bool?
  provider_openai: bool?
  provider_openrouter: bool?
  provider_ollama: bool?
  hide_free_models: bool?
  llm_strategy: "list(balanced|cost_first|quality_first)"
  automatic_policy: "str?"
  chat_policy: "str?"

  # ── Local Model (Ollama) ──────────────────────────────────────────────────
  local_model:
    url: str
    model: str
    request_timeout: int(10,1800)?

  # ── MQTT ─────────────────────────────────────────────────────────────────
  mqtt:
    host: str
    port: int(1,65535)
    user: str
    password: password

  # ── Memory & RAG ──────────────────────────────────────────────────────────
  memory:
    embedding_provider: str
    embedding_model: str
    rag_k: int(1,50)

  # ── General ───────────────────────────────────────────────────────────────
  internal_token: password
  execute_api_tools: "str?"
  execute_api_entities: "str?"
  execute_api_services: "str?"
  execute_api_read_denylist: "str?"
  internal_mcp_port: port?
  supervisor_ingress_cidr: "str?"
  log_level: "list(debug|info|warning|error)"
  theme: "list(light|dark|auto)"
  apprise_urls:
    - str
  history_retention_days: int(0,3650)

  # ── Sentinella (knobs) ────────────────────────────────────────────────────
  sentinel_daily_cap: int(0,200)
  sentinel_cooldown_min: int(1,1440)
  sentinel_allow_green_auto: bool
  sentinel_ronda_min: int(1,240)
  agent_owner: str?

  # ── Brain (salute del sistema) ───────────────────────────────────────────
  brain_notify_high: bool

  # ── Ponte push (knobs) ────────────────────────────────────────────────────
  bridge_enabled: bool
  bridge_deadline_min: int(1,120)
  bridge_fallback: bool
  chat_daily_cap: int(0,1000)?
  chat_via_subscription: bool?
  claude_code_oauth_token: password

  # ── Mayan EDMS (documenti) ────────────────────────────────────────────────
  mayan:
    url: str
    token: password
    tag_id: int(0,100000)
    sensitivity: "list(normal|sensitive)"
    poll_minutes: int(5,1440)?

  # ── Debug ─────────────────────────────────────────────────────────────────
  debug_expose_port: bool
