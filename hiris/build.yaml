# **Qui NON si fissa piu' l'immagine di base**, e non e' una dimenticanza.
#
# La 3.64.0 la fissava qui, per impronta, e **ruppe l'aggiornamento della casa
# vera** (23/09/2026). Il Supervisor valida `build_from` con
# `RE_DOCKER_IMAGE_BUILD` (`supervisor/apps/validate.py`), che non ammette
# `@`: un'impronta qui e' un valore non valido. E il Supervisor **non si
# ferma** -- stampa un WARNING e prosegue coi default, cioe'
# `ghcr.io/home-assistant/base:latest`, Alpine nuda senza Python. La
# costruzione moriva tre passi dopo con `/bin/ash: pip3: not found`.
#
# Il pin vive nel `Dockerfile`, in uno stadio per architettura -- dove Docker
# l'impronta la accetta, e dove il Supervisor stesso chiede di mettere i
# parametri di costruzione («build.yaml is deprecated», lo stampa a ogni
# giro). La ragione per intero, e il prezzo, stanno scritti li'.
#
# Se un giorno `build_from` dovesse tornare qui: `tests/test_immagine_di_base.py`
# esegue la regex VERA del Supervisor su quello che questo file dichiara, e
# dice subito se verra' accettato -- invece di lasciarlo scoprire a una casa
# che non si aggiorna piu'.
squash: false
