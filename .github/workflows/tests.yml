name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: hiris/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hiris/requirements.txt

      - name: Run pytest
        env:
          HIRIS_ALLOW_NO_TOKEN: "1"
          HIRIS_ALLOW_NO_CSRF: "1"
        run: |
          pytest -q --maxfail=10 --durations=20

  jstest:
    name: frontend (node --test + jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    name: lint (ruff + oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hiris/requirements.txt

      - name: Install ruff
        run: pip install -r hiris/requirements.txt

      # I bersagli sono NOMINATI, mai `.`: `Testbook/`, `Nuova grafica/` e
      # `.mockups/` esistono in locale e non qui, e un cancello che guarda cose
      # diverse nei due posti non e' un cancello.
      - name: ruff
        run: python -m ruff check hiris scripts tests conftest.py .smoke-test

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `--deny-warnings` e' dentro lo script: senza, oxlint esce 0 pur avendo
      # segnalato tutto (misurato il 27/08/2026).
      - run: npm run lint
